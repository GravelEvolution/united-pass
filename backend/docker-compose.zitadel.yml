# Description: Docker Compose stack for the local ZITADEL development instance
#

# Local ZITADEL instance for development and integration tests.
#
# Usage:
#   docker compose -f docker-compose.zitadel.yml up -d
#   ./scripts/zitadel-init.sh
#
# The instance is exposed at http://localhost:8080 (plain HTTP, dev only).
# The first-time admin (firstuser) is:
#   login:    admin@zitadel.localhost
#   password: AdminPassword1!
#
# Never use this composition for production; production ZITADEL requires TLS,
# secrets management and a hardened database.
services:
  zitadel-db:
    image: postgres:16-alpine
    environment:
      # Superuser for ZITADEL's init step (ZITADEL_DATABASE_POSTGRES_ADMIN_*).
      # ZITADEL then creates its own runtime user "zitadel".
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zitadel
      POSTGRES_DB: zitadel
    volumes:
      - zitadel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zitadel -d zitadel"]
      interval: 5s
      timeout: 3s
      retries: 10

  zitadel:
    # v2.71 is the last v2 release line: the init script and zitadel-go v3
    # SDK target the v2 API, and the v2 default instance supports the
    # resource-owner password grant used by zitadel-init.sh. v3 removed the
    # password grant by default.
    #
    # Security baseline: >= v2.71.18 is mandatory. v2.71.0..v2.71.17 are
    # affected by GHSA-cfjq-28r2-4jv5 / CVE-2025-64103 (CVSS 8.7 High):
    # the Session API may treat single-factor sessions as fully
    # authenticated on accounts that have a second factor enrolled.
    image: ghcr.io/zitadel/zitadel:v2.71.18
    command: start-from-init --masterkeyFromEnv
    depends_on:
      zitadel-db:
        condition: service_healthy
    environment:
      # Database (ZITADEL manages its schema via the admin user).
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      # Public endpoint (plain HTTP, local dev only).
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: "8080"
      ZITADEL_TLS: "false"
      # Encryption key for ZITADEL's own secrets. Must be exactly 32 bytes.
      # Development-only fixed value; production must inject it via secrets
      # management.
      ZITADEL_MASTERKEY: MasterkeyNeedsToBeChangedInProd!
      # First admin user created on first startup.
      ZITADEL_FIRSTUSER_USERNAME: admin@zitadel.localhost
      ZITADEL_FIRSTUSER_PASSWORD: AdminPassword1!
      ZITADEL_FIRSTUSER_ORG: UnitedPassDev
      # Pre-provision an IAM_OWNER machine user with a JSON key written to a
      # file. The key lets zitadel-init.sh authenticate with JWT profile
      # (v2.71+ rejects the resource-owner password grant). The key file is
      # created once during first setup and must be treated as a secret.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: up-init-sa
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: United Pass init service account
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINEKEY_TYPE: "1"
      ZITADEL_FIRSTINSTANCE_MACHINEKEYPATH: /zitadel-init/init-sa.json
      ZITADEL_LOG_LEVEL: info
    ports:
      - "8080:8080"
    volumes:
      - ./.zitadel:/zitadel-init
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/debug/ready"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  zitadel-db-data:
