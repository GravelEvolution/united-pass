  /api/v1/admin/applications/{applicationId}/clients:
    post:
      tags: [Admin OAuth Clients]
      summary: Add a new OAuth client to the application
      description: |
        The client profile determines grant types, token endpoint auth method,
        redirect URI requirements and `openid` eligibility (see ADR-0004 §3).
        Unsupported combinations return 422; submitted values are never
        silently mutated. Confidential clients receive their secret exactly
        once in the `201` response.
