        createdAt:
          type: string
          format: date-time
        lastRotatedAt:
          type: string
          format: date-time
          nullable: true

    ApplicationGrantSummary:
      type: object
      description: User grant summary. Always an empty array until Phase 3.
      required: [grantId, userLabel, scopes, grantedAt, status]
      additionalProperties: false
      properties:
        grantId:
          type: string
        userLabel:
          type: string
        scopes:
          type: array
          items:
            type: string
        grantedAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, revoked]

    ApplicationAuditEntry:
      type: object
      description: Security event actually recorded for the application (no fake data).
      required: [eventId, eventType, actorName, occurredAt, result]
      additionalProperties: false
      properties:
        eventId:
          type: string
        eventType:
          type: string
          example: oauth_client.secret_rotated
        actorName:
          type: string
        occurredAt:
          type: string
          format: date-time
        result:
          type: string
          enum: [success, denied]

    OAuthApplication:
      type: object
      description: Application list item.
      required:
        [applicationId, name, audience, ownerId, ownerName, status, clientCount, updatedAt]
      additionalProperties: false
      properties:
        applicationId:
          type: string
          example: app_01HQFGXKN8H2C4JVMW7K3R4D8Z
        name:
          type: string
        audience:
          type: string
          enum: [internal, external, hybrid]
        ownerId:
          type: string
          description: Stable owner user ID (authoritative; G1 fix).
        ownerName:
          type: string
          description: Derived display name of the owner; never authoritative.
        status:
          type: string
          enum: [active, disabled]
        clientCount:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time

    ApplicationListResponse:
      type: object
      required: [items, page]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OAuthApplication"
        page:
          type: object
          required: [nextCursor, hasMore]
          additionalProperties: false
          properties:
            nextCursor:
              type: string
              nullable: true
              description: Opaque HMAC-signed cursor; null when no more pages.
            hasMore:
              type: boolean

    OAuthClient:
      type: object
      description: OAuth client detail. Secret values are never included.
      required:
        [clientId, applicationId, name, clientType, grantTypes,
         tokenEndpointAuthMethod, redirectUris, allowedScopes, consentMode,
         status, clientSecrets, createdAt, updatedAt]
      additionalProperties: false
      properties:
        clientId:
          type: string
          example: clt_01HQFGXKN8H2C4JVMW7K3R4D8Z
        applicationId:
          type: string
        name:
          type: string
        clientType:
          type: string
          enum: [public, confidential]
        grantTypes:
          type: array
          items:
            type: string
            enum: [authorization_code, refresh_token, client_credentials]
        tokenEndpointAuthMethod:
          type: string
          enum: [client_secret_basic, none]
          description: |
            Only values with verified provider support and a reviewed security
            model are exposed in Phase 2 (`client_secret_post` and
            `private_key_jwt` are rejected with 422).
        redirectUris:
          type: array
          items:
            $ref: "#/components/schemas/RedirectUriEntry"
        logoutUri:
          type: string
          nullable: true
        allowedScopes:
          type: array
          items:
            $ref: "#/components/schemas/ScopeCatalogItem"
        consentMode:
          type: string
          enum: [always, first_authorization]
          description: |
            For `server_to_server` clients only `always` is accepted and it is
            recorded as not-applicable metadata.
        status:
          type: string
          enum: [active, disabled]
        clientSecrets:
          type: array
          description: Secret metadata; empty for public clients.
          items:
            $ref: "#/components/schemas/ClientSecretRecord"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OAuthApplicationDetail:
      type: object
      required:
        [applicationId, name, description, audience, ownerId, ownerName,
         status, clients, grants, auditEntries, createdAt, updatedAt]
      additionalProperties: false
      properties:
        applicationId:
          type: string
        name:
          type: string
        description:
          type: string
        logoUrl:
          type: string
          format: uri
          nullable: true
        audience:
          type: string
          enum: [internal, external, hybrid]
        ownerId:
          type: string
        ownerName:
          type: string
        status:
          type: string
          enum: [active, disabled]
        clients:
          type: array
          items:
            $ref: "#/components/schemas/OAuthClient"
        grants:
          type: array
          description: Real grants only; always empty until Phase 3.
          items:
            $ref: "#/components/schemas/ApplicationGrantSummary"
        auditEntries:
          type: array
          description: Only security events actually recorded.
          items:
            $ref: "#/components/schemas/ApplicationAuditEntry"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApplicationCreateInput:
      type: object
      required: [name, audience, ownerId]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
          maxLength: 500
          default: ""
        audience:
          type: string
          enum: [internal, external, hybrid]
        ownerId:
          type: string
          description: |
            Stable United Pass user ID of the owner. Must exist; ownership is
            never resolved from a display name (G1 fix).

    OAuthClientCreateRequest:
      type: object
      required: [name, profile, redirectUris, allowedScopes, consentMode]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 64
        profile:
          type: string
          enum: [web_server, spa_mobile, server_to_server]
          description: |
            `server_to_server` is kept in the enum for forward compatibility
            but is rejected with a 422 `profile` field error: ZITADEL v2.71
            serves client_credentials tokens only for machine users, so a
            provisioned OIDC app could never execute the grant.
        redirectUris:
          type: array
          maxItems: 20
          description: |
            Exact strings; https or loopback http only; no fragments,
            userinfo, wildcards or normalization. Required for interactive
            profiles, forbidden for `server_to_server`.
          items:
            type: string
            maxLength: 2048
        logoutUri:
          type: string
          maxLength: 2048
          default: ""
          description: Same security checks as redirect URIs.
        allowedScopes:
          type: array
          description: Registered scope IDs only; duplicates rejected.
          items:
            type: string
        consentMode:
          type: string
          enum: [always, first_authorization]

    ApplicationWithInitialClientRequest:
      type: object
      required: [application, initialClient]
      additionalProperties: false
      properties:
        application:
          $ref: "#/components/schemas/ApplicationCreateInput"
        initialClient:
          $ref: "#/components/schemas/OAuthClientCreateRequest"

    ApplicationWithInitialClientResponse:
      type: object
      required: [applicationId, clientId]
      additionalProperties: false
      properties:
        applicationId:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
          writeOnly: true
          description: |
            Present exactly once for confidential clients; absent for public
            clients. Never persisted, never queryable afterwards.

    OAuthClientCreationResponse:
      type: object
      required: [clientId]
      additionalProperties: false
      properties:
        clientId:
          type: string
        clientSecret:
          type: string
          writeOnly: true
          description: Present exactly once for confidential clients.

    ApplicationUpdateRequest:
      type: object
      description: Partial update; at least one field required.
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
          maxLength: 500
        audience:
          type: string
          enum: [internal, external, hybrid]
        ownerId:
          type: string
          description: New owner user ID; must exist.

    OAuthClientUpdateRequest:
      type: object
      description: |
        Partial update; at least one field required. Profile is immutable.
        When `redirectUris` is present it replaces the full set.
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 64
        redirectUris:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 2048
        logoutUri:
          type: string
          maxLength: 2048
          nullable: true
        allowedScopes:
          type: array
          items:
            type: string
        consentMode:
          type: string
          enum: [always, first_authorization]

    SecretRotationResponse:
      type: object
      required: [secretId, clientSecret, previousSecretExpiresAt]
      additionalProperties: false
      properties:
        secretId:
          type: string
          description: United Pass secret ID for the new secret.
        clientSecret:
          type: string
          writeOnly: true
          description: The new secret, shown exactly once. Never persisted.
        previousSecretExpiresAt:
          type: string
          format: date-time
          description: |
            Expiry of the previous secret. Against ZITADEL v2.71 this equals
            the rotation timestamp (zero grace period).

    PublicLoginProvider:
      type: object
      required: [providerId, displayName, loginEnabled]
      additionalProperties: false
      properties:
        providerId:
          type: string
        displayName:
          type: string
        loginEnabled:
          type: boolean

    PublicLoginProviderList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicLoginProvider"

    IdentityProviderSummary:
      type: object
      required:
        [providerId, displayName, vendor, integrationLabel, status,
         loginEnabled, linkedUserCount, updatedAt]
      additionalProperties: false
      properties:
        providerId:
          type: string
        displayName:
          type: string
        vendor:
          type: string
          enum: [feishu, generic]
        integrationLabel:
          type: string
        status:
          type: string
          enum: [planned, active, disabled]
        loginEnabled:
          type: boolean
        linkedUserCount:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time

    IdentityProviderListResponse:
      type: object
      required: [items, page]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IdentityProviderSummary"
        page:
          $ref: "#/components/schemas/CursorPageMetadata"

    IdentityProviderDetail:
      type: object
      required:
        [providerId, displayName, vendor, integrationLabel, status,
         loginEnabled, linkedUserCount, updatedAt, appId, secretConfigured,
         callbackUrl, contactScope, lastValidatedAt, lastSyncAt, lastSyncResult]
      additionalProperties: false
      properties:
        providerId:
          type: string
        displayName:
          type: string
        vendor:
          type: string
          enum: [feishu, generic]
        integrationLabel:
          type: string
        status:
          type: string
          enum: [planned, active, disabled]
        loginEnabled:
          type: boolean
        linkedUserCount:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        appId:
          type: string
          description: Non-secret application identifier.
        secretConfigured:
          type: boolean
          description: Boolean server-side credential readiness only; never the secret.
        callbackUrl:
          type: string
          format: uri
        contactScope:
          type: string
        lastValidatedAt:
          type: string
          format: date-time
          nullable: true
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
        lastSyncResult:
          allOf:
            - $ref: "#/components/schemas/DirectorySyncResult"
          nullable: true

    DirectorySyncResult:
      type: object
      required:
        [syncId, providerId, startedAt, completedAt, status, departmentsAdded,
         departmentsUpdated, employeesAdded, employeesUpdated,
         employeesOffboarded, conflictsDetected]
      additionalProperties: false
      properties:
        syncId:
          type: string
        providerId:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [pending, running, success, partial, failed]
        departmentsAdded:
          type: integer
          minimum: 0
        departmentsUpdated:
          type: integer
          minimum: 0
        employeesAdded:
          type: integer
          minimum: 0
        employeesUpdated:
          type: integer
          minimum: 0
        employeesOffboarded:
          type: integer
          minimum: 0
        conflictsDetected:
          type: integer
          minimum: 0

    DirectorySyncHistoryEntry:
      type: object
      required: [syncId, providerId, startedAt, completedAt, status, summary]
      additionalProperties: false
      properties:
        syncId:
          type: string
        providerId:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [pending, running, success, partial, failed]
        summary:
          type: string

    ProviderSyncConflict:
      type: object
      required:
        [conflictId, providerId, externalSubject, externalName, externalEmail,
         matchedUserId, matchedUserName, matchReason, status, detectedAt]
      additionalProperties: false
      properties:
        conflictId:
          type: string
        providerId:
          type: string
        externalSubject:
          type: string
        externalName:
          type: string
        externalEmail:
          type: string
        matchedUserId:
          type: string
          nullable: true
          description: Search suggestion only until an administrator explicitly resolves.
        matchedUserName:
          type: string
          nullable: true
        matchReason:
          type: string
          enum: [email, name, manual]
        status:
          type: string
          enum: [pending, resolved, ignored]
        detectedAt:
          type: string
          format: date-time

    ResolveProviderConflictRequest:
      type: object
      required: [userId]
      additionalProperties: false
      properties:
        userId:
          type: string
          description: Explicit existing stable United Pass user ID.

    PolicyClause:
      type: object
      required: [attribute, operator, value]
      additionalProperties: false
      properties:
        attribute:
          type: string
          pattern: "^[a-z][A-Za-z0-9_]{0,63}$"
        operator:
          type: string
          enum: [eq, neq, in, not_in, gt, lt, contains]
        value:
          type: string
          maxLength: 256

    PolicyDraftRequest:
      type: object
      required: [name, description, resource, action, effect, principals, conditions]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 1000}
        resource: {type: string, minLength: 1, maxLength: 128, example: "application:*"}
        action: {type: string, minLength: 1, maxLength: 128, example: application.manage}
        effect: {type: string, enum: [allow, deny]}
        principals:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/PolicyClause"}
        conditions:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/PolicyClause"}

    PolicyUpdateRequest:
      type: object
      required: [expectedVersion, name, description, resource, action, effect, principals, conditions]
      additionalProperties: false
      properties:
        expectedVersion: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 1000}
        resource: {type: string, minLength: 1, maxLength: 128}
        action: {type: string, minLength: 1, maxLength: 128}
        effect: {type: string, enum: [allow, deny]}
        principals:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/PolicyClause"}
        conditions:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/PolicyClause"}

    PolicyMutationResult:
      type: object
      required: [policyId, version]
      additionalProperties: false
      properties:
        policyId: {type: string}
        version: {type: integer, minimum: 1}

    PolicySummary:
      type: object
      required: [policyId, name, resource, version, status, updatedBy, updatedAt]
      additionalProperties: false
      properties:
        policyId: {type: string}
        name: {type: string}
        resource: {type: string}
        version: {type: integer, minimum: 1}
        status: {type: string, enum: [draft, published]}
        updatedBy: {type: string}
        updatedAt: {type: string, format: date-time}

    PolicyVersionSummary:
      type: object
      required: [version, status, updatedBy, updatedAt, changeSummary]
      additionalProperties: false
      properties:
        version: {type: integer, minimum: 1}
        status: {type: string, enum: [draft, published]}
        updatedBy: {type: string}
        updatedAt: {type: string, format: date-time}
        changeSummary: {type: string}

    PolicyDetail:
      type: object
      required: [policyId, name, description, resource, action, effect, version, status, principals, conditions, updatedBy, updatedAt, versionHistory]
      additionalProperties: false
      properties:
        policyId: {type: string}
        name: {type: string}
        description: {type: string}
        resource: {type: string}
        action: {type: string}
        effect: {type: string, enum: [allow, deny]}
        version: {type: integer, minimum: 1}
        status: {type: string, enum: [draft, published]}
        principals:
          type: array
          items: {$ref: "#/components/schemas/PolicyClause"}
        conditions:
          type: array
          items: {$ref: "#/components/schemas/PolicyClause"}
        updatedBy: {type: string}
        updatedAt: {type: string, format: date-time}
        versionHistory:
          type: array
          items: {$ref: "#/components/schemas/PolicyVersionSummary"}

    PolicyPage:
      type: object
      required: [items, page]
      additionalProperties: false
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/PolicySummary"}
        page: {$ref: "#/components/schemas/CursorPageMetadata"}

    PolicySimulationRequest:
      type: object
      required: [principalAttributes, resourceAttributes, action]
      additionalProperties: false
      properties:
        principalAttributes:
          type: object
          maxProperties: 30
          additionalProperties: {type: string, maxLength: 256}
        resourceAttributes:
          type: object
          maxProperties: 30
          additionalProperties: {type: string, maxLength: 256}
        action: {type: string, maxLength: 128}

    PolicySimulationResult:
      type: object
      required: [decision, matchedPolicyId, matchedPolicyName, evaluatedAt, reasons]
      additionalProperties: false
      properties:
        decision: {type: string, enum: [allow, deny, no_match]}
        matchedPolicyId: {type: [string, "null"]}
        matchedPolicyName: {type: [string, "null"]}
        evaluatedAt: {type: string, format: date-time}
        reasons:
          type: array
          items: {type: string}

    AuditQuery:
      type: object
      additionalProperties: false
      properties:
        cursor: {type: string}
        limit: {type: integer, minimum: 1, maximum: 100}
        query: {type: string, maxLength: 200}
        eventType: {type: string, maxLength: 120}
        result: {type: string, enum: [success, denied]}
        actorName: {type: string, maxLength: 120}
        requestId: {type: string, maxLength: 200}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}

    AuditEvent:
      type: object
      required: [eventId, eventType, actorName, actorId, targetLabel, targetId, occurredAt, result, requestId, details]
      additionalProperties: false
      properties:
        eventId: {type: string}
        eventType: {type: string}
        actorName: {type: string}
        actorId: {type: string}
        targetLabel: {type: string}
        targetId: {type: string}
        occurredAt: {type: string, format: date-time}
        result: {type: string, enum: [success, denied]}
        requestId: {type: string}
        details: {type: string, description: Fixed safe operation label; never raw payload or provider error.}

    AuditEventPage:
      type: object
      required: [items, page]
      additionalProperties: false
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AuditEvent"}
        page: {$ref: "#/components/schemas/CursorPageMetadata"}

    AuditExport:
      type: object
      required: [exportId, status, downloadUrl, requestedAt, completedAt, totalEvents]
      additionalProperties: false
      properties:
        exportId: {type: string}
        status: {type: string, enum: [pending, processing, completed, failed]}
        downloadUrl: {type: [string, "null"]}
        requestedAt: {type: string, format: date-time}
        completedAt: {type: [string, "null"], format: date-time}
        totalEvents: {type: integer, minimum: 0}

    PersonalDataExport:
      type: object
      required: [exportId, status, requestedAt, completedAt, expiresAt, downloadUrl, totalSections]
      additionalProperties: false
      properties:
        exportId: {type: string, pattern: "^pexp_[A-Za-z0-9_-]{13,74}$"}
        status: {type: string, enum: [pending, processing, completed, failed]}
        requestedAt: {type: string, format: date-time}
        completedAt: {type: [string, "null"], format: date-time}
        expiresAt: {type: [string, "null"], format: date-time}
        downloadUrl: {type: [string, "null"]}
        totalSections: {type: integer, minimum: 0}

    AccountDeletion:
      type: object
      required: [deletionId, status, requestedAt, executeAfter, cancelledAt, completedAt]
      additionalProperties: false
      properties:
        deletionId: {type: string, pattern: "^del_[A-Za-z0-9_-]{13,75}$"}
        status: {type: string, enum: [pending, processing, provider_deleted, completed, cancelled, failed]}
        requestedAt: {type: string, format: date-time}
        executeAfter: {type: string, format: date-time}
        cancelledAt: {type: [string, "null"], format: date-time}
        completedAt: {type: [string, "null"], format: date-time}

    AccountDeletionState:
      oneOf:
        - type: object
          required: [status]
          additionalProperties: false
          properties:
            status: {type: string, const: none}
        - $ref: "#/components/schemas/AccountDeletion"

    PublicLegalPublication:
      type: object
      required: [documentKind, version, contentSha256, effectiveAt, publishedAt, status]
      additionalProperties: false
      properties:
        documentKind: {type: string, enum: [privacy, terms]}
        version: {type: string}
        contentSha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        effectiveAt: {type: string, format: date-time}
        publishedAt: {type: string, format: date-time}
        status: {type: string, enum: [scheduled, effective]}

    LegalPublicationList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 2
          items: {$ref: "#/components/schemas/PublicLegalPublication"}

    DreamUPOpaqueOperationalId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
      description: Opaque event-scoped identifier. Clients must not infer type or ownership from its prefix.

    DreamUPEmptyMutationRequest:
      type: object
      additionalProperties: false
      maxProperties: 0

    DreamUPImageDescriptor:
      type: object
      required: [objectKey, contentType, byteSize, sha256]
      additionalProperties: false
      properties:
        objectKey:
          type: string
          minLength: 1
          maxLength: 512
          pattern: "^private/events/[A-Za-z0-9._:-]+/[A-Za-z0-9._:/-]+\\.(jpg|png)$"
          not: { pattern: '(^|/)\.\.(/|$)' }
          description: Private object key issued by the corresponding upload-intent route; `..` path segments are forbidden.
        contentType: { type: string, enum: [image/jpeg, image/png] }
        byteSize: { type: integer, minimum: 1, maximum: 5242880 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }

    DreamUPNullableImageDescriptor:
      oneOf:
        - $ref: "#/components/schemas/DreamUPImageDescriptor"
        - type: "null"

    DreamUPRestrictedImageLink:
      type: object
      required: [url, contentType, byteSize, sha256, expiresAt]
      additionalProperties: false
      properties:
        url: { type: string, format: uri, maxLength: 4096 }
        contentType: { type: string, enum: [image/jpeg, image/png] }
        byteSize: { type: integer, minimum: 1, maximum: 5242880 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        expiresAt: { type: string, format: date-time }

    DreamUPAdminImageUploadIntentRequest:
      type: object
      required: [fileName, contentType, byteSize, width, height, sha256]
      additionalProperties: false
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: "^[^\\r\\n]+$"
        contentType: { type: string, enum: [image/jpeg, image/png] }
        byteSize: { type: integer, minimum: 1, maximum: 5242880 }
        width:
          type: integer
          minimum: 1
          description: Width times height must not exceed 8,000,000 pixels.
        height:
          type: integer
          minimum: 1
          description: Width times height must not exceed 8,000,000 pixels.
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        entityId:
          allOf: [{ $ref: "#/components/schemas/DreamUPOpaqueOperationalId" }]
          description: Optional stable entity identifier with the route-specific point_, asset_, personal_catalog_, splash_poster_, or announcement_ prefix.

    DreamUPAdminImageUploadIntent:
      type: object
      required: [uploadId, entityId, entityType, image, uploadUrl, uploadMethod, requiredHeaders, expiresAt, status, version, replayed]
      additionalProperties: false
      properties:
        uploadId: { $ref: "#/components/schemas/DreamUPOpaqueOperationalId" }
        entityId: { $ref: "#/components/schemas/DreamUPOpaqueOperationalId" }
        entityType: { type: string, enum: [inspection_point, asset_catalog, personal_asset_assignment, splash_poster, announcement_background] }
        image: { $ref: "#/components/schemas/DreamUPImageDescriptor" }
        uploadUrl: { type: string, format: uri, maxLength: 4096 }
        uploadMethod: { type: string, const: PUT }
        requiredHeaders:
          type: object
          required: [content-type, x-content-sha256]
          additionalProperties: false
          properties:
            content-type: { type: string, enum: [image/jpeg, image/png] }
            x-content-sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [issued, uploaded, consumed, purging, expired] }
        version: { type: integer, minimum: 1 }
        replayed: { type: boolean }

    DreamUPSplashPosterImage:
      type: object
      required: [objectKey, contentType, byteSize, width, height, sha256]
      additionalProperties: false
      properties:
        objectKey:
          type: string
          minLength: 64
          maxLength: 512
          pattern: '^private/events/[A-Za-z0-9._:-]+/splash-posters/splash_poster_[A-Za-z0-9._:-]{1,114}/images/cleared/admin_image_upload_[0-9a-f]{40}[.](jpg|png)$'
        contentType: { type: string, enum: [image/jpeg, image/png] }
        byteSize: { type: integer, minimum: 1, maximum: 5242880 }
        width: { type: integer, minimum: 1, maximum: 8000000 }
        height: { type: integer, minimum: 1, maximum: 8000000 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }

    DreamUPSplashPoster:
      type: object
      required: [id, status, version, revision, altText, image, updatedAt]
      additionalProperties: false
