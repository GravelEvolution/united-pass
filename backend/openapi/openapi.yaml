    DreamUPNativeReauthenticationRequest:
      type: object
      additionalProperties: false
      required: [loginCode, eventId, action, target]
      properties:
        loginCode:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 2048
          description: Fresh one-use `wx.login` code. Never stored, logged, or returned.
        eventId:
          $ref: "#/components/schemas/DreamUPOpaqueOperationalId"
        action:
          type: string
          description: Exact high-risk DreamUP administrator capability authorized by the grant.
          enum:
            - event.application.review
            - event.application.approve_admission
            - event.application.decide
            - event.registration.manage
            - event.checkin.scan
            - event.checkin.manage_window
            - event.identity_access.consume
            - event.identity.read_restricted
            - event.legal.read
            - event.application.export
            - event.audit.read
            - event.contact_submission.manage
            - event.content.manage
            - event.inspection.point.manage
            - event.inspection.perform
            - event.inspection.review
            - event.asset.manage
            - event.asset.reservation.manage
            - event.asset.custody.transfer
            - event.asset.inventory.adjust
            - event.personal_asset.assignment.manage
            - event.asset.code.rotate
            - event.qr.print.single
            - event.qr.print.bulk
            - system.role_migration.read
        target:
          type: string
          minLength: 1
          maxLength: 900
          description: Canonical JSON tuple `["dreamup-admin-target/v1", eventId, resourceKind, resourceId]`; alternate JSON encodings and cross-event targets are rejected.

    ReauthenticationRequest:
      type: object
      description: |
        Declares the high-risk action being prepared and verifies the current
        session user's password. Target resource IDs must match the eventual
        operation; the grant is bound to them. DreamUP administrator actions
        additionally require `eventId` and a canonical target tuple, and forbid
        `applicationId` and `clientId`.
      required: [action, password]
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
            - application.delete
            - client.delete
            - client.secret.rotate
            - account.password.change
            - account.email.change
            - account.totp.enroll
            - account.totp.remove
            - account.passkey.enroll
            - account.passkey.remove
            - user.disable
            - user.sessions.revoke
            - employee.offboard
            - registration.abuse.unblock
            - event.application.review
            - event.application.approve_admission
            - event.application.decide
            - event.registration.manage
            - event.checkin.scan
            - event.checkin.manage_window
            - event.identity_access.consume
            - event.identity.read_restricted
            - event.legal.read
            - event.application.export
            - event.audit.read
            - event.contact_submission.manage
            - event.content.manage
            - event.inspection.point.manage
            - event.inspection.perform
            - event.inspection.review
            - event.asset.manage
            - event.asset.reservation.manage
            - event.asset.custody.transfer
            - event.asset.inventory.adjust
            - event.personal_asset.assignment.manage
            - event.asset.code.rotate
            - event.qr.print.single
            - event.qr.print.bulk
            - system.role_migration.read
          description: The high-risk action the grant will authorize.
        eventId:
          $ref: "#/components/schemas/DreamUPOpaqueOperationalId"
        applicationId:
          type: string
          description: Target application for application-scoped actions; must be empty for account actions.
        clientId:
          type: string
          description: Target client (required for client actions).
        target:
          type: string
          description: |
            Required for `account.passkey.remove` (passkey ID) and for the
            Phase 5 target-user actions (stable user ID). For
            `registration.abuse.unblock`, use the exact server-defined binding
            `<dimension>_<sha256>` returned or derived by the operator tool;
            the revoke request must present a grant bound to the same target.
            DreamUP actions require the canonical JSON tuple
            `["dreamup-admin-target/v1", eventId, resourceKind, resourceId]`.
            Forbidden for actions that do not define a target.
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
          description: Current session user's password. Never logged.

    ReauthenticationGrantResponse:
      type: object
      required: [status, reauthToken, expiresAt]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [granted]
        reauthToken:
          type: string
          description: |
            Single-use grant token submitted as `X-Reauthentication-Token`.
            Consumed atomically by the target operation.
        expiresAt:
          type: string
          format: date-time

    ReauthenticationChallengeResponse:
      type: object
      description: Returned with 202 when a second factor must complete verification.
      required: [status, reauthToken, availableMethods, expiresAt]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [mfa_required]
        reauthToken:
          type: string
          description: Opaque challenge token for `POST /api/v1/auth/reauthentication/mfa`.
        availableMethods:
          type: array
          items:
            type: string
            enum: [totp, passkey]
        passkeyRequestOptions:
          type: object
          description: WebAuthn request options when `passkey` is available.
        expiresAt:
          type: string
          format: date-time

    ReauthenticationMfaRequest:
      type: object
      required: [reauthToken, method]
      additionalProperties: false
      properties:
        reauthToken:
          type: string
          minLength: 1
          description: Challenge token from the `202` response.
        method:
          type: string
          enum: [totp, passkey]
        code:
          type: string
          minLength: 1
          writeOnly: true
          description: TOTP code; required for `totp`. Never logged.
        passkeyAssertion:
          type: object
          writeOnly: true
          description: WebAuthn assertion; required for `passkey`. Never logged.

    SecuritySummary:
      type: object
      required: [password, totp, passkeys, recoveryCodes]
      additionalProperties: false
      properties:
        password:
          type: object
          required: [set]
          additionalProperties: false
          properties:
            set: { type: boolean }
        totp:
          type: object
          required: [enabled]
          additionalProperties: false
          properties:
            enabled: { type: boolean }
        passkeys:
          type: array
          items:
            $ref: "#/components/schemas/PasskeySummary"
        recoveryCodes:
          type: object
          required: [available, deferredReason]
          additionalProperties: false
          properties:
            available:
              type: boolean
              const: false
            deferredReason:
              type: string
              const: provider_unsupported

    PasswordChangeRequest:
      type: object
      required: [newPassword]
      additionalProperties: false
      properties:
        newPassword:
          type: string
          minLength: 1
          format: password
          writeOnly: true
          description: New password only. The current password is never accepted by this endpoint.

    TotpEnrollmentResponse:
      type: object
      required: [enrollmentToken, secret, otpauthUri]
      additionalProperties: false
      properties:
        enrollmentToken:
          type: string
          minLength: 1
          writeOnly: true
          description: Single-use user/session-bound confirmation capability.
        secret:
          type: string
          minLength: 1
          writeOnly: true
          description: TOTP seed returned exactly once; never logged or persisted by United Pass.
        otpauthUri:
          type: string
          minLength: 1
          pattern: "^otpauth://"
          writeOnly: true
          description: Secret-bearing authenticator URI returned exactly once.

    TotpEnrollmentConfirmRequest:
      type: object
      required: [enrollmentToken, code]
      additionalProperties: false
      properties:
        enrollmentToken:
          type: string
          minLength: 1
          writeOnly: true
        code:
          type: string
          minLength: 1
          writeOnly: true
          description: User-entered TOTP code. Never logged.

    TotpEnrollmentConfirmation:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          const: confirmed

    TotpEnrollmentCancelRequest:
      type: object
      required: [enrollmentToken]
      additionalProperties: false
      properties:
        enrollmentToken:
          type: string
          minLength: 1
          writeOnly: true

    UserSession:
      type: object
      required:
        - sessionId
        - deviceName
        - clientName
        - approximateLocation
        - ipAddressMasked
        - lastActiveAt
        - createdAt
        - authenticationMethods
        - isCurrent
      additionalProperties: false
      properties:
        sessionId:
          type: string
          minLength: 1
