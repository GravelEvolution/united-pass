  /api/v1/registrations/form-intents:
    post:
      tags: [Registration]
      summary: Issue a short-lived registration form intent
      description: |
        Creates a one-use, server-timed intent bound to digests of the current
        user agent, trusted client network, exact Origin, and a mandatory
        server-issued risk device. Issuance establishes the HttpOnly risk-device
        cookie when needed. The registration mutation rejects missing, expired,
        replayed, or implausibly immediate intents before provisioning an identity.
        Its first clean submission atomically pins the normalized email before
        email rate budgets or CAPTCHA resources are allocated. Email and pair
        creation budgets are charged only after that exact tuple completes its
        interactive challenge. The post-proof create charge is atomic and one
        same-network, same-email final-commit retry is idempotent. A request
        rejected by any saturated creation bucket does not advance the other
        buckets. A deterministic account conflict releases only the bound
        long-lived email charge while retaining the shorter client, network
        and client/email charges.
      operationId: issueRegistrationFormIntent
      parameters:
        - $ref: "#/components/parameters/RegistrationOrigin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "201":
          description: Short-lived form intent issued.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegistrationFormIntentResponse"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/BadRequest"}
        "415": {$ref: "#/components/responses/BadRequest"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "502": {$ref: "#/components/responses/ProviderUnavailable"}

  /api/v1/registrations:
    post:
      tags: [Registration]
      summary: Create a pending public account registration
      description: |
        Creates a ZITADEL human user with a United Pass-controlled user ID and
        transactionally pre-creates the matching local pending identity link
        and consumer persona. The account cannot authenticate until its email
        is verified. Passwords are write-only and never logged. Duplicate
        account names and emails share one generic conflict response. This
        legacy browser surface is absent unless
        `UP_PUBLIC_REGISTRATION_ENABLED=true`; enabling Mini Program
        registration does not expose it.

        Every valid form intent must complete one interactive
        `moonstone_image_digits` challenge before a pending identity can be
        provisioned. The challenge trust is bound to the server device, user
        agent, trusted client network, normalized email, exact form-intent token and exact Origin. It is
        not bypassed by a first low-risk attempt, an authenticated session or a
        login allowlist, and it never degrades to proof-of-work. Only the exact
        automatic retry may reach account creation; the form intent is then
        atomically consumed. A forged intent is rejected before it can spend an
        email rate-limit bucket or allocate a challenge.

        One exact form-intent/device/network tuple may have only one active
        challenge. Repeated or concurrent issuance returns 429 without creating
        another provider answer. Device/network issuance and cross-challenge
        completion budgets prevent cookie, intent or challenge rotation from
        resetting the verification budget. A completed trust is bound to the
        registration operation and exact composite identifier and cannot be
        reused for login.
      operationId: createRegistration
      parameters:
        - $ref: "#/components/parameters/RegistrationOrigin"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegistrationCreateRequest"}
      responses:
        "201":
          description: Pending account created and verification email requested.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegistrationCreateResponse"}
        "403":
          description: Origin rejected, or the mandatory registration image challenge must be completed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/BadRequest"}
        "415": {$ref: "#/components/responses/BadRequest"}
        "422": {$ref: "#/components/responses/FieldValidationFailed"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "502": {$ref: "#/components/responses/ProviderUnavailable"}

  /api/v1/registrations/email/verify:
    post:
      tags: [Registration]
      summary: Verify a pending account email and activate the account
      description: |
        The browser reads userId, code and requestId from the URL fragment,
        erases the fragment from history, and sends them in this JSON body.
        Verification codes therefore never enter HTTP or reverse-proxy access
        logs. Provider verification precedes the transactional local activation.
        This shared pending-account lifecycle is present when either legacy
        browser registration or Mini Program registration is enabled. It
        cannot create an account and does not expose the legacy create route.
      operationId: verifyRegistrationEmail
      parameters:
        - $ref: "#/components/parameters/RegistrationOrigin"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegistrationVerifyRequest"}
      responses:
        "200":
          description: Email verified and local account activated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegistrationVerifyResponse"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/BadRequest"}
        "415": {$ref: "#/components/responses/BadRequest"}
        "422": {$ref: "#/components/responses/FieldValidationFailed"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "502": {$ref: "#/components/responses/ProviderUnavailable"}

  /api/v1/registrations/email/resend:
    post:
      tags: [Registration]
      summary: Resend the pending registration email verification
      description: |
        Accepts only the short-lived opaque registration token. Redis stores
        only its SHA-256 hash mapped to the provider user ID and validated
        authorization request ID; callers cannot submit or select a user ID.
        This shared pending-account lifecycle is present when either legacy
        browser registration or Mini Program registration is enabled. The
        opaque token cannot create or select an arbitrary account.
      operationId: resendRegistrationEmail
      parameters:
        - $ref: "#/components/parameters/RegistrationOrigin"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegistrationResendRequest"}
      responses:
        "202":
          description: A fresh verification email was requested.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegistrationResendResponse"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/BadRequest"}
        "415": {$ref: "#/components/responses/BadRequest"}
        "422": {$ref: "#/components/responses/FieldValidationFailed"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "502": {$ref: "#/components/responses/ProviderUnavailable"}

  /api/v1/registrations/wechat:
    post:
      tags: [WeChat Mini Program, Registration]
      summary: Create a pending account with mandatory verified WeChat identity and phone binding
      description: |
        This Mini Program-only registration flow accepts only fresh one-time
        `wx.login` and `getPhoneNumber` codes. The API verifies them server-side
        and durably reserves a retryable pending identity before provider
        creation. Activation remains fail-closed until the verified phone,
        primary provider link, WeChat identity link and consumer persona are
        all complete. The route is absent unless both
        `UP_WECHAT_MINIPROGRAM_ENABLED=true` and the independent
        `UP_WECHAT_MINIPROGRAM_REGISTRATION_ENABLED=true` gate are set. It does
        not depend on, or enable, the legacy `UP_PUBLIC_REGISTRATION_ENABLED`
        browser surface. Requests must carry the exact
        `X-UnitedPass-Client: dreamup-miniprogram` transport marker; the marker
        grants no authority and a missing or incorrect value fails closed.
        Before contacting WeChat, the server atomically advances a dedicated
        source-IP budget and claims both hashed one-time codes; an over-budget source cannot create per-code Redis keys. The ordinary registration
        IP, network, normalized-email and IP/email budgets advance only after
        WeChat has verified both identity and phone proofs, so random
        format-valid codes cannot exhaust another user's email budget.
      operationId: createWeChatRegistration
      parameters:
        - $ref: "#/components/parameters/X-MiniProgram-Client"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WeChatRegistrationCreateRequest"}
      responses:
        "201":
          description: Pending account reserved and provider verification requested; email verification is still required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegistrationCreateResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/BadRequest"}
        "415": {$ref: "#/components/responses/BadRequest"}
        "422": {$ref: "#/components/responses/FieldValidationFailed"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "502": {$ref: "#/components/responses/ProviderUnavailable"}

  /api/v1/admin/registration-defense/blocks/revoke:
    post:
      tags: [Admin Registration Defense]
      summary: Revoke one false-positive registration abuse block
      description: |
        Requires a browser session, matching CSRF token, an active system
        `super_admin` or `top_admin` binding, an active/non-offboarding
        principal, and authoritative `policy.manage` plus `audit.read`
        capabilities. It also consumes a single-use reauthentication grant
        for `registration.abuse.unblock`, bound to `<dimension>_<sha256>`, and
        is rate limited per administrator. The request accepts one explicit
        raw IP address or a server-issued risk-device token. Because that token
        is HttpOnly, device recovery may instead use the exact lowercase SHA-256
        digest already present in the abuse audit. IP recovery always
        canonicalizes and hashes the raw address at the HTTP boundary. Redis
        prefixes and arbitrary keys are never accepted. The authorized request
        and terminal outcome are written to the durable security audit log.
        Audit targets use a purpose-separated HMAC, so neither the raw
        fingerprint nor the enumerable SHA-256 of an IPv4 address is stored.
      operationId: revokeRegistrationAbuseBlock
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/X-Reauthentication-Token"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegistrationAbuseBlockRevokeRequest"}
      responses:
        "204": {description: The selected block dimension and associated strike state were revoked.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/BadRequest"}
        "422": {$ref: "#/components/responses/FieldValidationFailed"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/auth/sessions:
    post:
      tags: [Session]
      summary: Establish a browser session
      description: |
        Authenticates the caller with a unified identifier (account name or email)
        and password, then establishes a browser session.

        On success the server issues two cookies:
          * `up_session` — HttpOnly, Secure, SameSite session cookie.
          * `up_csrf`   — CSRF token cookie readable by browser JavaScript.

        Both cookies are returned via `Set-Cookie`. The browser must not receive
        raw authentication-provider Refresh Tokens or long-lived tokens.

        When the account requires multi-factor authentication, the server responds
        `202` with an opaque `mfaToken` and the list of available methods instead
        of establishing the session. The MFA challenge is completed via
        `POST /api/v1/auth/sessions/mfa`.

        Authentication failures return generic errors that do not reveal whether
        the account, email or phone number exists. Passwords are never logged.

        Rate limited. Repeated failures return `429` with a `Retry-After` header.
        Objective, server-observed abuse signals may instead return `403` with
        `error.code=step_up_required`. No name, display name, writing style, or
        other subjective content participates in that decision.
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              credentials:
                value:
                  identifier: zhixing.lin
                  password: user-entered-password
                  remember: true
              resumeAuthorization:
                value:
                  identifier: zhixing.lin
                  password: user-entered-password
                  remember: false
                  resumeRequestId: req_01ABCdefGHIjkl
      responses:
        "204":
          description: |
            Session established successfully. No response body. The
            `up_session` and `up_csrf` cookies are set.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Set-Cookie:
              $ref: "#/components/headers/Set-Session-Cookies"
        "202":
          description: |
            Multi-factor authentication is required before the session can be
            established. The caller must complete the challenge at
            `POST /api/v1/auth/sessions/mfa`.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFARequiredResponse"
              example:
                status: mfa_required
                mfaToken: opaque_mfa_token
                availableMethods: [totp, passkey, recovery_code]
                expiresAt: "2026-08-05T12:05:30Z"
        "400":
          description: Malformed request body or missing required fields.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: validation.failed
                  message: "请求参数有误，请检查后重试。"
                  requestId: req_0123456789abcdef
                  fieldErrors:
                    - field: identifier
                      message: "该字段不能为空。"
        "401":
          description: |
            Authentication was rejected. Invalid credentials and provider-side
            authorization faults use the same generic response so the result
            does not reveal whether the identifier corresponds to an existing
            account.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: session.unauthenticated
                  message: "账户名或密码错误。"
                  requestId: req_0123456789abcdef
        "403":
          description: Objective abuse signals require a single-use step-up challenge.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "413":
          description: Request body exceeds the configured maximum size.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: request.too_large
                  message: "请求体过大。"
                  requestId: req_0123456789abcdef
        "429":
          description: |
            Too many login attempts. The caller must wait before retrying.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Retry-After:
              $ref: "#/components/headers/Retry-After"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: auth.rate_limited
                  message: "尝试次数过多，请稍后再试。"
                  requestId: req_0123456789abcdef
        "500":
          description: Unexpected server failure.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: internal.unexpected
                  message: "服务暂时无法处理该请求。"
                  requestId: req_0123456789abcdef

  /api/v1/auth/step-up:
    post:
      tags: [Session]
      summary: Complete an objective registration/login abuse step-up
      description: |
        Completes the single-use challenge returned as
        `error.stepUp.challengeToken`. `automation_cost` is a computational
        anti-automation cost only and is not human verification. High-risk
        `interactive_captcha` requires a configured interactive provider; the
        server fails closed with `503` when no provider is configured. Success
        sets a short-lived HttpOnly `up_device_trust` cookie. Tokens are stored
        only by SHA-256 hash and cannot be replayed.
      operationId: completeAuthRiskStepUp
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StepUpCompletionRequest"}
      responses:
        "204":
          description: Challenge consumed and short-lived device trust issued.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "503":
          description: Interactive step-up provider or challenge store unavailable; fail closed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /api/v1/auth/miniprogram/sessions:
    post:
      tags: [WeChat Mini Program]
      summary: Establish a native Mini Program session with United Pass credentials
      description: |
        Native-only password login. Browser-shaped requests are rejected and
        the exact `X-UnitedPass-Client: dreamup-miniprogram` marker is required;
        the marker is transport routing only and grants no authority. Successful
        authentication returns a 256-bit opaque bearer for process memory only.
        The server persists only its SHA-256 hash and binds the record to the
        native client kind and the user's security epoch. No cookie is read or
        written, the fixed lifetime is 30 minutes, and remember mode is rejected.
        An MFA challenge is bound to this native channel.
      operationId: createMiniProgramPasswordSession
      parameters:
        - $ref: "#/components/parameters/X-MiniProgram-Client"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MiniProgramLoginRequest"}
      responses:
        "200":
          description: Short-lived native bearer established; no Set-Cookie header is emitted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MiniProgramSessionResponse"}
        "202":
          description: MFA is required; complete only through the matching native MFA route.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MFARequiredResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "415": {$ref: "#/components/responses/BadRequest"}
        "429": {$ref: "#/components/responses/TooManyRequests"}

  /api/v1/auth/miniprogram/sessions/mfa:
    post:
      tags: [WeChat Mini Program]
      summary: Complete a native Mini Program password-login TOTP challenge
      description: |
        Completes only an MFA challenge minted by the native password-login
        route. Challenges from browser login fail closed. Only TOTP is accepted;
        passkey-only or recovery-only accounts must use the trusted browser flow.
      operationId: completeMiniProgramPasswordSessionMfa
      parameters:
        - $ref: "#/components/parameters/X-MiniProgram-Client"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MiniProgramMFAChallengeRequest"}
      responses:
        "200":
          description: Short-lived native bearer established; no Set-Cookie header is emitted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MiniProgramSessionResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "415": {$ref: "#/components/responses/BadRequest"}
        "429": {$ref: "#/components/responses/TooManyRequests"}

  /api/v1/auth/wechat/onboarding:
    post:
      tags: [WeChat Mini Program]
      summary: Begin explicit WeChat account onboarding or restore an existing link
      description: |
        Exchanges fresh `wx.login` and `getPhoneNumber` codes only on the
        server. Both proofs are mandatory: absence, rejection or provider
        failure creates neither an account, onboarding challenge nor session.
        An already-linked active account receives a normal short-lived native
        bearer only after the verified phone is atomically reconciled against
        that exact linked account. An unlinked WeChat identity receives only a
        restricted, single-use onboarding token, never an account session. An
        exact linked pending reservation may re-enter only to reconcile that
        same pending user after a prior provider/token-store interruption.
        OpenID, UnionID,
        `session_key`, decoded phone data and provider credentials are never
        returned to the Mini Program. All three onboarding routes are absent
        unless `UP_WECHAT_MINIPROGRAM_ENABLED`,
        `UP_WECHAT_MINIPROGRAM_REGISTRATION_ENABLED` and the independent,
        default-off `UP_WECHAT_MINIPROGRAM_ONBOARDING_ENABLED` gate are true.
      operationId: beginWeChatMiniProgramOnboarding
      parameters:
        - $ref: "#/components/parameters/X-MiniProgram-Client"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WeChatOnboardingBeginRequest"}
      responses:
        "200":
          description: The WeChat identity was already linked and a native bearer was established.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MiniProgramSessionResponse"}
        "202":
          description: Account details must be completed before any normal session is issued.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WeChatOnboardingRequiredResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/WeChatOnboardingConflict"}
        "413": {$ref: "#/components/responses/BadRequest"}
        "415": {$ref: "#/components/responses/BadRequest"}
        "422": {$ref: "#/components/responses/WeChatOnboardingPhoneRequired"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "502": {$ref: "#/components/responses/ProviderUnavailable"}

  /api/v1/auth/wechat/onboarding/complete:
    post:
      tags: [WeChat Mini Program]
      summary: Complete United Pass account details for a verified WeChat identity
      description: |
        Consumes a restricted onboarding challenge containing a mandatory,
        server-verified phone proof. A new email creates a
        pending account through the existing provider and email-verification
        lifecycle. An email already owned by exactly one active account treats
        `password` only as that account's current credential proof; it never
        changes the password or copies provisional profile data. Accounts with
        MFA receive a dedicated onboarding MFA challenge before the WeChat link
        can be committed. Global registration buckets are consumed only after
        the restricted challenge is claimed. The exact existing-email password
        error is available only inside this rate-limited, verified WeChat workflow.
      operationId: completeWeChatMiniProgramOnboarding
      parameters:
        - $ref: "#/components/parameters/X-MiniProgram-Client"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WeChatOnboardingCompleteRequest"}
      responses:
        "200":
          description: Existing account authentication and binding completed; a native bearer was established.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MiniProgramSessionResponse"}
        "201":
          description: A pending new account was created and email verification is required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WeChatOnboardingVerificationRequiredResponse"}
        "202":
          description: The existing account requires its registered second factor.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WeChatOnboardingMFARequiredResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/WeChatOnboardingCompleteUnauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/WeChatOnboardingConflict"}
        "413": {$ref: "#/components/responses/BadRequest"}
        "415": {$ref: "#/components/responses/BadRequest"}
        "422": {$ref: "#/components/responses/WeChatOnboardingPhoneRequired"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "502": {$ref: "#/components/responses/ProviderUnavailable"}

  /api/v1/auth/wechat/onboarding/mfa:
    post:
      tags: [WeChat Mini Program]
      summary: Complete the existing account's MFA before linking WeChat
      description: |
        Accepts only the dedicated single-use onboarding MFA token. Successful
        provider MFA is followed by the allowlisted identity-link transaction;
        no provisional display, email, role or permission field overwrites the
        existing account.
      operationId: completeWeChatMiniProgramOnboardingMFA
      parameters:
        - $ref: "#/components/parameters/X-MiniProgram-Client"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WeChatOnboardingMFARequest"}
      responses:
        "200":
          description: MFA and account binding completed; a native bearer was established.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MiniProgramSessionResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/WeChatOnboardingMFAUnauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/WeChatOnboardingConflict"}
        "413": {$ref: "#/components/responses/BadRequest"}
        "415": {$ref: "#/components/responses/BadRequest"}
        "422": {$ref: "#/components/responses/WeChatOnboardingPhoneRequired"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "502": {$ref: "#/components/responses/ProviderUnavailable"}

  /api/v1/me/wechat/phone:
    post:
      tags: [WeChat Mini Program]
      summary: Verify and bind the current user's WeChat-authorized phone
      description: |
        Requires the current native bearer and exact Mini Program marker. Both
        one-time codes are independently exchanged by the server; the resolved
        WeChat identity must already link to the current user, preventing a
        cross-account phone bind.
      operationId: bindWeChatMiniProgramPhone
      security: [{MiniProgramBearer: []}]
      parameters:
        - $ref: "#/components/parameters/X-MiniProgram-Client"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WeChatPhoneBindRequest"}
      responses:
        "200":
          description: Phone proof verified and reflected on the current account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WeChatPhoneBindResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/WeChatPhoneConflict"}
        "413": {$ref: "#/components/responses/BadRequest"}
        "415": {$ref: "#/components/responses/BadRequest"}
        "422": {$ref: "#/components/responses/FieldValidationFailed"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "502": {$ref: "#/components/responses/ProviderUnavailable"}

  /api/v1/auth/sessions/mfa:
    post:
      tags: [Session]
      summary: Complete a multi-factor authentication challenge
      description: |
        Submits a verification code or assertion to complete an MFA challenge
        started by `POST /api/v1/auth/sessions`.

        The `mfaToken` is the opaque token returned in the `202` login response.
        It is short-lived and single-use per attempt. Excessive failed attempts
        result in temporary lockout (`429`).

        On success the server issues the `up_session` and `up_csrf` cookies,
        identical to a successful password-only login.

        Rate limited.
      operationId: completeSessionMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAChallengeRequest"
            example:
              mfaToken: opaque_mfa_token
              method: totp
              code: "123456"
      responses:
        "204":
          description: |
            MFA challenge completed and session established successfully. No
            response body. The `up_session` and `up_csrf` cookies are set.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Set-Cookie:
              $ref: "#/components/headers/Set-Session-Cookies"
        "400":
          description: Malformed request body or missing required fields.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: validation.failed
                  message: "请求参数有误，请检查后重试。"
                  requestId: req_0123456789abcdef
                  fieldErrors:
                    - field: code
                      message: "请输入 6 位数字验证码。"
        "401":
          description: |
            The MFA token is invalid, expired, or the submitted code is wrong.
            The response is generic and does not reveal which condition failed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: auth.mfa_challenge_failed
                  message: "验证失败，请检查后重试。"
                  requestId: req_0123456789abcdef
        "429":
          description: |
            Too many MFA attempts. The challenge is temporarily locked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Retry-After:
              $ref: "#/components/headers/Retry-After"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: auth.rate_limited
                  message: "尝试次数过多，请稍后再试。"
                  requestId: req_0123456789abcdef
        "500":
          description: Unexpected server failure.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: internal.unexpected
                  message: "服务暂时无法处理该请求。"
                  requestId: req_0123456789abcdef

  /api/v1/dreamup/mobile/assertions:
    post:
      tags: [Account]
      summary: Mint one request-bound DreamUP participant assertion
      operationId: createDreamUPMobileAssertion
      description: |
        Requires the explicit native bearer and Mini Program marker. The
        returned assertion is short-lived and bound to the exact method, path,
        body digest and selected concurrency/idempotency headers. It is not a
        United Pass session credential.
      security: [{ MiniProgramBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/X-MiniProgram-Client"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [method, path, body, ifMatch, idempotencyKey]
              properties:
                method: { type: string, enum: [GET, PUT, POST, PATCH, DELETE] }
                path: { type: string, minLength: 1, maxLength: 2048 }
                body:
                  type: string
                  maxLength: 65536
                  description: >-
                    UTF-8 request payload. Limits use encoded UTF-8 bytes: 8 KiB
                    for feedback/sponsorship, seat confirmation and admission
                    entry-code routes; 16 KiB for team routes; and 64 KiB for
                    other allowlisted routes.
                ifMatch: { type: string, maxLength: 128 }
                idempotencyKey: { type: string, maxLength: 128 }
      responses:
        "201":
          description: One request-bound assertion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DreamUPMobileAssertionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/FieldValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/dreamup/mobile/resume-upload-assertions:
    post:
      tags: [Account]
      summary: Mint one request-bound DreamUP resume-upload assertion
      operationId: createDreamUPResumeUploadAssertion
      description: The file bytes stay outside United Pass; the assertion binds bounded metadata and the caller-supplied SHA-256 digest.
      security: [{ MiniProgramBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/X-MiniProgram-Client"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [method, path, fileName, contentType, byteSize, bodySha256]
              properties:
                method: { type: string, const: PUT }
                path: { type: string, minLength: 1, maxLength: 2048 }
                fileName:
                  type: string
                  minLength: 1
                  maxLength: 255
                  x-max-utf8-bytes: 255
                  description: Resume filename encoded as valid UTF-8, limited to 255 UTF-8 bytes (not characters).
                contentType:
                  type: string
                  enum: [application/pdf, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document]
                byteSize: { type: integer, format: int64, minimum: 1, maximum: 5242880 }
                bodySha256:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                  description: Canonical lowercase SHA-256 hex digest of the bytes uploaded directly to DreamUP.
      responses:
        "201":
          description: One request-bound resume upload assertion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DreamUPMobileAssertionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/FieldValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/auth/qr/challenges:
    post:
      tags: [Session]
      summary: Begin a browser QR-login handoff
      operationId: beginQRLoginChallenge
      description: Browser-only same-origin mutation. The receiver proof is returned only as a scoped HttpOnly cookie; the JSON challenge ID is safe to render as a QR code.
      responses:
        "201":
          description: QR-login challenge created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [challengeId, expiresInSeconds]
                properties:
                  challengeId: { type: string, pattern: "^[A-Za-z0-9_-]{20,255}$" }
                  expiresInSeconds: { type: integer, minimum: 1, maximum: 600 }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ProviderUnavailable" }

  /api/v1/auth/qr/challenges/{challengeId}/consume:
    post:
      tags: [Session]
      summary: Consume a browser QR-login handoff
      operationId: consumeQRLoginChallenge
      description: Browser-only same-origin mutation requiring the independent scoped HttpOnly receiver cookie.
      parameters:
        - $ref: "#/components/parameters/QRChallengeIdPath"
      responses:
        "200":
          description: Browser session established; normal session and CSRF cookies are emitted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, csrfToken]
                properties:
                  status: { type: string, const: authenticated }
                  csrfToken: { type: string, minLength: 1 }
        "202":
          description: Challenge remains pending.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: pending }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ProviderUnavailable" }

  /api/v1/auth/qr/challenges/{challengeId}/approve:
    post:
      tags: [Session]
      summary: Approve a scanned QR-login handoff from the Mini Program
      operationId: approveQRLoginChallenge
      description: Native bearer and marker only. No browser session cookie, receiver proof or CSRF token is accepted as the Mini Program credential.
      security: [{ MiniProgramBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/QRChallengeIdPath"
        - $ref: "#/components/parameters/X-MiniProgram-Client"
      responses:
        "200":
          description: Challenge approved for its waiting browser receiver.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties: { status: { type: string, const: approved } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ProviderUnavailable" }

  /api/v1/auth/session:
    delete:
      tags: [Session]
      summary: Revoke the current session (logout)
      description: |
        Browser callers authenticate with `up_session` plus matching CSRF and
        receive clearing cookies. Native callers authenticate with the explicit
        Mini Program bearer and marker; no cookie or CSRF value participates.
      operationId: deleteSession
      security:
        - SessionCookie: []
        - MiniProgramBearer: []
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/X-MiniProgram-Client-When-Bearer"
      responses:
        "204":
          description: |
            Session revoked successfully. No response body. The `up_session`
            and `up_csrf` cookies are cleared.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Set-Cookie:
              $ref: "#/components/headers/Clear-Session-Cookies"
        "401":
          description: No valid session cookie was supplied.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: auth.unauthenticated
                  message: "请先登录后再继续。"
                  requestId: req_0123456789abcdef
        "403":
          description: |
            CSRF validation failed. The `X-CSRF-Token` header is missing or does
            not match the `up_csrf` cookie.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: csrf.validation_failed
                  message: "跨站请求验证失败，请刷新页面后重试。"
                  requestId: req_0123456789abcdef
        "500":
          description: Unexpected server failure.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: internal.unexpected
                  message: "服务暂时无法处理该请求。"
                  requestId: req_0123456789abcdef

  /api/v1/me:
    get:
      tags: [Account]
      summary: Get the current user
      description: |
        Returns the profile of the authenticated browser-cookie or native
        Mini Program bearer session.

        The stable United Pass `userId` is the identity primary key. It is not
        an email, phone number or external Provider identifier, and it does not
        change when an external user becomes an employee.

        `employeeProfile` is optional and present only when the user has an
        active employee persona. When an external user is linked to an employee
        profile, the same `userId` is preserved and the consumer persona
        remains.

        Responses must not be cached.
      operationId: getCurrentUser
      security:
        - SessionCookie: []
        - MiniProgramBearer: []
      parameters:
        - $ref: "#/components/parameters/X-MiniProgram-Client-When-Bearer"
      responses:
        "200":
          description: Current user profile.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Cache-Control:
              description: Prevents the browser and intermediaries from caching the response.
              schema:
                type: string
                enum: [no-store]
                default: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
              example:
                userId: usr_01HQFGXKN8H2C4JVMW7K3R4D8Z
                displayName: 林知行
                nickname: 知行
                avatarUrl: https://cdn.example.com/avatars/usr_01HQFGXKN8H2C4JVMW7K3R4D8Z.webp
                email: zhixing.lin@example.com
                phoneMasked: "+86 138****0123"
                personas: [consumer, employee]
                employeeProfile:
                  employeeId: EMP-10032
                  departmentName: 平台架构部
                  title: 高级工程师
        "401":
          description: No valid session cookie was supplied.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: auth.unauthenticated
                  message: "请先登录后再继续。"
                  requestId: req_0123456789abcdef
        "500":
          description: Unexpected server failure.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: internal.unexpected
                  message: "服务暂时无法处理该请求。"
                  requestId: req_0123456789abcdef

  /api/v1/me/miniprogram/profile:
    post:
      tags: [Account]
      summary: Update self-service profile from the DreamUP Mini Program
      description: |
        Transport adaptation for `wx.request`, which does not support PATCH.
        This operation has the same self-service semantics as profile update,
        but requires an explicit native bearer, no `Origin` header and the
        exact `X-UnitedPass-Client: dreamup-miniprogram` marker. The marker
        does not authorize the request; it only selects the native transport.
      operationId: updateCurrentProfileFromMiniProgram
      security: [{ MiniProgramBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/X-MiniProgram-Client"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName: {type: string, minLength: 1, maxLength: 64}
                nickname: {type: string, maxLength: 64}
      responses:
        "204": {description: Profile updated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/FieldValidationFailed"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/me/email-change:
    post:
      tags: [Account]
      summary: Send a verification code to a new primary login email
      description: Requires a single-use, current-session `account.email.change` reauthentication grant before any provider or mail side effect.
      operationId: beginAccountEmailChange
      security: [{ SessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/X-Reauthentication-Token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email, maxLength: 254 } }
              additionalProperties: false
      responses:
        "202": { description: Verification sent }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/me/email-change/verify:
    post:
      tags: [Account]
      summary: Verify and activate a new primary login email
      operationId: verifyAccountEmailChange
      security: [{ SessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, code]
              properties:
                requestId: { type: string, pattern: "^email_change_[0-9a-f]{32}$" }
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  pattern: "^[A-Z0-9]{6}$"
                  description: Case-sensitive email verification code containing uppercase ASCII letters and digits.
                  example: A1B2C3
              additionalProperties: false
      responses:
        "200": { description: New primary login email activated }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/FieldValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/me/permissions:
    get:
      tags: [Account]
      summary: Get current user permission capabilities
      description: |
        Returns the permission capabilities computed for the authenticated user
        from authoritative backend attributes (employee status, department,
        ownership, etc.) and Cerbos policy decisions.

        These capabilities are a user-experience summary only — they drive
        frontend navigation visibility and control availability. Every
        protected backend operation must independently authenticate, load
        authoritative attributes, authorize via Cerbos, enforce the decision
        and audit the operation. Frontend permission checks are not security
        controls.

        Responses must not be cached.
      operationId: getCurrentPermissions
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Current user permission capabilities.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Cache-Control:
              description: Prevents the browser and intermediaries from caching the response.
              schema:
                type: string
                enum: [no-store]
                default: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionCapabilities"
              example:
                userRead: true
                userDisable: false
                employeeManage: true
                employeeOffboard: false
                departmentManage: false
                applicationRead: true
                applicationManage: false
                applicationSecretRotate: false
                policyRead: true
                policyManage: false
                policyPublish: false
                auditRead: true
                auditExport: false
                providerRead: true
                providerManage: false
        "401":
          description: No valid session cookie was supplied.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: auth.unauthenticated
                  message: "请先登录后再继续。"
                  requestId: req_0123456789abcdef
        "500":
          description: Unexpected server failure.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: internal.unexpected
                  message: "服务暂时无法处理该请求。"
                  requestId: req_0123456789abcdef

  /api/v1/legal-documents:
    get:
      tags: [Privacy and Legal]
      summary: List current controlled legal-document publications
      description: Returns public status only. Approval references and approver identities are never exposed.
      operationId: listLegalDocuments
      responses:
        "200":
          description: Current effective or scheduled publications whose content digest was accepted by the release manifest.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalPublicationList"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/me/data-exports:
    post:
      tags: [Privacy and Legal]
      summary: Request a short-lived personal-data export
      description: Consumes a single-use `account.data_export` reauthentication grant. Only one pending or processing export is allowed per user.
      operationId: requestPersonalDataExport
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/X-Reauthentication-Token"
      responses:
        "202":
          description: Export job accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PersonalDataExport"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/me/data-exports/{exportId}:
    get:
      tags: [Privacy and Legal]
      summary: Read an owned personal-data export job
      description: Foreign and unknown export IDs return the same 404 response.
      operationId: getPersonalDataExport
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PersonalDataExportIdPath"
      responses:
        "200":
          description: Current job status and a download URL only while the completed artifact remains live.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PersonalDataExport"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/me/data-exports/{exportId}/download:
    get:
      tags: [Privacy and Legal]
      summary: Download an owned, unexpired personal-data JSON artifact
      operationId: downloadPersonalDataExport
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PersonalDataExportIdPath"
      responses:
        "200":
          description: JSON attachment. The artifact is physically purged after its 15-minute lifetime.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/me/account-deletion:
    get:
      tags: [Privacy and Legal]
      summary: Read the current account-deletion lifecycle
      operationId: getAccountDeletion
      security:
        - SessionCookie: []
      responses:
        "200":
          description: "Current deletion request, or `{status: none}`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountDeletionState"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      tags: [Privacy and Legal]
      summary: Start a cancellable 30-day account-deletion cooling period
      description: Consumes a single-use `account.delete` reauthentication grant. Provider deletion and local anonymisation run durably after the cooling period.
      operationId: requestAccountDeletion
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/X-Reauthentication-Token"
      responses:
        "202":
          description: Deletion request accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountDeletion"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      tags: [Privacy and Legal]
      summary: Cancel a deletion request during its cooling period
      operationId: cancelAccountDeletion
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
      responses:
        "200":
          description: Deletion request cancelled.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountDeletion"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/auth/reauthentication:
    post:
      tags: [Reauthentication]
      summary: Reauthenticate the current session user for a high-risk action
      description: |
        Verifies the current session user's password for the declared action
        (and optional target resource). Returns the grant immediately, or a
        `202` challenge when a second factor must complete the verification.
        Challenges are random opaque IDs bound to user + session + action,
        with a short TTL and attempt limit. Redis loss only invalidates
        challenges (fail closed).
      operationId: requestReauthentication
      security:
        - SessionCookie: []
        - MiniProgramBearer: []
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/X-MiniProgram-Client-When-Bearer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthenticationRequest"
      responses:
        "200":
          description: Reauthentication succeeded; single-use grant issued.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReauthenticationGrantResponse"
        "202":
          description: Second factor required to complete reauthentication.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReauthenticationChallengeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/me/security:
    get:
      tags: [Account Security]
      summary: Read provider-authoritative account security state
      operationId: getAccountSecuritySummary
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Password, TOTP, individual passkeys and recovery-code capability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/ProviderUnavailable"
        "503":
          $ref: "#/components/responses/ProviderForbidden"
        "500":
