        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/FieldValidationFailed"}
        "428": {$ref: "#/components/responses/PreconditionRequired"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/admin/events/{eventId}/identity-access/requests/{requestId}/reject:
    post:
      tags: [Restricted Identity Access]
      summary: Reject a request after fresh administrator step-up
      operationId: rejectIdentityAccessRequest
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DreamUPEventIdPath"
        - $ref: "#/components/parameters/IdentityAccessRequestIdPath"
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/If-Match"
        - $ref: "#/components/parameters/X-Reauthentication-Token"
      responses:
        "200":
          description: Rejected, or an identical terminal mutation safely replayed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IdentityAccessDecisionResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "428": {$ref: "#/components/responses/PreconditionRequired"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/admin/events/{eventId}/identity-access/grants/{grantId}/claim:
    post:
      tags: [Restricted Identity Access]
      summary: Claim an approved identity-access grant for internal delegation
      description: |
        Creates a one-minute internal claim lease. The browser response contains
        only opaque metadata; the one-time nonce and restricted values remain in
        the trusted server boundary for delegation-token issuance.
      operationId: claimIdentityAccessGrant
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DreamUPEventIdPath"
        - $ref: "#/components/parameters/IdentityAccessGrantIdPath"
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/If-Match"
      responses:
        "202":
          description: The internal claim is ready for the trusted BFF signer.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IdentityAccessClaimResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "428": {$ref: "#/components/responses/PreconditionRequired"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/admin/step-up/challenge:
    get:
      tags: [Administrator Step-up]
      summary: Read the current administrator challenge state and question
      operationId: getAdminStepUpChallenge
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DreamUPEventIdQuery"
      responses:
        "200":
          description: Owner-only challenge state. The answer hash and encryption metadata are never returned.
          headers:
            X-Request-ID: {$ref: "#/components/headers/X-Request-ID"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminStepUpChallengeResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/FieldValidationFailed"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/admin/step-up/enroll:
    post:
      tags: [Administrator Step-up]
      summary: Enroll an administrator challenge after fresh provider login
      description: A fresh provider-backed primary login is always required. Existing TOTP, passkey, or recovery MFA is accepted; only an active system-scoped super_admin or top_admin with no existing challenge may use the initial-enrollment bootstrap exception without existing MFA. A federated session lacking provider session proof receives session.reauthentication_required.
      operationId: enrollAdminStepUpChallenge
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminStepUpEnrollRequest"}
      responses:
        "201":
          description: Challenge enrolled. No question or answer material is echoed.
          headers:
            X-Request-ID: {$ref: "#/components/headers/X-Request-ID"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminStepUpMutationResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/FieldValidationFailed"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/admin/step-up/verify:
    post:
      tags: [Administrator Step-up]
      summary: Verify the administrator challenge for one fixed action and target
      operationId: verifyAdminStepUpChallenge
      description: |
        Requires a provider-backed primary login no older than 30 minutes.
        Stale or implausibly future authentication timestamps fail before the
        answer verifier with `session.reauthentication_required`. Sensitive
        DreamUP actions mint a five-minute action-and-target-bound one-shot
        token; application review and check-in scan are high-risk mutations too.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminStepUpVerifyRequest"}
      responses:
        "200":
          description: |
            Verification receipt. A high-risk action may include one new
            single-use reauthentication bearer; an idempotent replay never
            returns or re-mints that bearer.
          headers:
            X-Request-ID: {$ref: "#/components/headers/X-Request-ID"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminStepUpMutationResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/FieldValidationFailed"}
        "423": {$ref: "#/components/responses/Locked"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/admin/step-up/rotate:
    post:
      tags: [Administrator Step-up]
      summary: Prove the old answer and atomically rotate the challenge
      operationId: rotateAdminStepUpChallenge
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/If-Match"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminStepUpRotateRequest"}
      responses:
        "200":
          description: Challenge rotated and prior freshness and approval state revoked.
          headers:
            X-Request-ID: {$ref: "#/components/headers/X-Request-ID"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminStepUpMutationResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/FieldValidationFailed"}
        "423": {$ref: "#/components/responses/Locked"}
        "428": {$ref: "#/components/responses/PreconditionRequired"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "500": {$ref: "#/components/responses/InternalError"}

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: up_session
      description: |
        Browser session cookie (`up_session`) issued by United Pass. The cookie
        is HttpOnly, Secure and carries an explicit SameSite policy. The browser
        must not receive raw authentication-provider Refresh Tokens or
        long-lived tokens.

    MiniProgramBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-256-bit-base64url
      description: |
        Short-lived opaque DreamUP Mini Program credential returned by a
        native password, TOTP or verified WeChat login. The raw 43-character
        base64url value is held only in module memory; only its SHA-256 hash is
        stored server-side. Requests must also carry the exact
        `X-UnitedPass-Client: dreamup-miniprogram` marker and no browser Origin
        or Fetch Metadata headers. Native bearer requests are not subject to
        ambient-cookie CSRF because no cookie participates in authentication.

  headers:
    ETag:
      description: Strong quoted resource version returned for optimistic concurrency.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'

    X-Request-ID:
      description: |
        The request ID used for log, error and audit correlation. The server
        accepts a valid upstream ID (alphanumeric, dash, underscore, colon;
        8-128 chars) or generates a cryptographically random `req_`-prefixed ID.
      schema:
        type: string
        pattern: "^[a-zA-Z0-9_:-]{8,128}$"
        example: req_0123456789abcdef0123456789abcdef

    Retry-After:
      description: |
        Seconds the client must wait before retrying a rate-limited request.
        Returned with `429` responses.
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 30

    Set-Session-Cookies:
      description: |
        Sets the browser session and CSRF cookies on successful authentication.
        Two cookies are issued:

          * `up_session` — HttpOnly, Secure, SameSite session cookie. Never
            contains a raw authentication-provider Refresh Token.
          * `up_csrf`   — CSRF token cookie readable by browser JavaScript,
            used to validate the `X-CSRF-Token` header on subsequent
            state-changing requests.

        Both cookies use restricted Path and explicit lifetime. Server-side
        revocation is supported.
      schema:
        type: string
        description: |
          A `Set-Cookie` header value. Two `Set-Cookie` headers are emitted,
          one for `up_session` and one for `up_csrf`.
        example: up_session=...; Path=/; HttpOnly; Secure; SameSite=Lax

    Clear-Session-Cookies:
      description: |
        Clears the browser session and CSRF cookies on logout. Both
        `up_session` and `up_csrf` are set with `Max-Age=0` so the browser
        discards them immediately.
      schema:
        type: string
        description: |
          A `Set-Cookie` header value with `Max-Age=0`. Two `Set-Cookie`
          headers are emitted, one for `up_session` and one for `up_csrf`.
        example: up_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax

  parameters:
    RegistrationOrigin:
      name: Origin
      in: header
      required: true
      description: Exact configured browser origin; cross-origin and missing values are rejected.
      schema: {type: string, format: uri}

    X-MiniProgram-Client:
      name: X-UnitedPass-Client
      in: header
      required: true
      description: Native transport marker only; it is not authentication and grants no authority.
      schema:
        type: string
        const: dreamup-miniprogram

    X-MiniProgram-Client-When-Bearer:
      name: X-UnitedPass-Client
      in: header
      required: false
      description: |
        Required and fixed to `dreamup-miniprogram` whenever the
        `MiniProgramBearer` security alternative is selected. Browser-cookie
        callers omit this transport marker.
      schema:
        type: string
        const: dreamup-miniprogram

    X-CSRF-Token:
      name: X-CSRF-Token
      in: header
      required: true
      description: |
        CSRF token that must match the value of the `up_csrf` cookie. Required
        on all browser-originated state-changing requests using cookie
        authentication. Safe HTTP methods must not mutate state.
      schema:
        type: string
        minLength: 1
        example: csrf_0123456789abcdef

    ApplicationIdPath:
      name: applicationId
      in: path
      required: true
      description: United Pass application ID (`app_…`).
      schema:
        type: string
        example: app_01HQFGXKN8H2C4JVMW7K3R4D8Z

    ClientIdPath:
      name: clientId
      in: path
      required: true
      description: |
        United Pass OAuth client ID (`clt_…`). The server asserts the client
        belongs to the path application; mismatch answers 404.
      schema:
        type: string
        example: clt_01HQFGXKN8H2C4JVMW7K3R4D8Z

    PasskeyIdPath:
      name: passkeyId
      in: path
      required: true
      description: Opaque provider-issued passkey identifier.
      schema:
        type: string
        minLength: 1

    SessionIdPath:
      name: sessionId
      in: path
      required: true
      description: Opaque 128-bit United Pass session identifier owned by the current user.
      schema:
        type: string
        minLength: 1

    QRChallengeIdPath:
      name: challengeId
      in: path
      required: true
      description: Opaque short-lived QR handoff identifier; never a session or receiver credential.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{20,255}$"

    UserIdPath:
      name: userId
      in: path
      required: true
      description: Stable United Pass user ID; never an email or provider subject.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,128}$"
        example: usr_01HQFGXKN8H2C4JVMW7K3R4D8Z

    DepartmentIdPath:
      name: departmentId
      in: path
      required: true
      description: United Pass department ID (`dep_…`).
      schema:
        type: string
        pattern: "^dep_[A-Za-z0-9_-]{1,124}$"

    ProviderIdPath:
      name: providerId
      in: path
      required: true
      description: United Pass Provider ID (`provider_…`).
      schema:
        type: string
        pattern: "^provider_[A-Za-z0-9_-]{1,119}$"

    ConflictIdPath:
      name: conflictId
      in: path
      required: true
      description: Durable Provider identity-link conflict ID (`conflict_…`).
      schema:
        type: string
        pattern: "^conflict_[A-Za-z0-9_-]{1,119}$"

    PolicyIdPath:
      name: policyId
      in: path
      required: true
      description: Stable United Pass authorization policy ID (`pol_…`).
      schema:
        type: string
        pattern: "^pol_[A-Za-z0-9_-]{8,76}$"

    AuditExportIdPath:
      name: exportId
      in: path
      required: true
      description: Durable audit export job ID (`exp_…`).
      schema:
        type: string
        pattern: "^exp_[A-Za-z0-9_-]{8,76}$"

    PersonalDataExportIdPath:
      name: exportId
      in: path
      required: true
      description: Requester-owned personal-data export job ID (`pexp_…`).
      schema:
        type: string
        pattern: "^pexp_[A-Za-z0-9_-]{13,74}$"

    AdminSessionIdPath:
      name: sessionId
      in: path
      required: true
      description: Opaque United Pass session ID asserted to belong to the target user.
      schema:
        type: string
        minLength: 1
        maxLength: 128

    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Opaque signed cursor returned by the previous page.
      schema:
        type: string
        minLength: 1
        maxLength: 4096

    DreamUPAdminCursorQuery:
      name: cursor
      in: query
      required: false
      description: Opaque signed cursor returned by the preceding DreamUP administrative page; it is bound to the event, filters, and sort order.
      schema:
        type: string
        minLength: 45
        maxLength: 2048
        pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]{43}$'

    LimitQuery:
      name: limit
      in: query
      required: false
      description: Page or bounded-list size; defaults to 20 and is capped at 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    DreamUPAdminLimitQuery:
      name: limit
      in: query
      required: false
      description: Maximum rows returned in one stable DreamUP administrative page; defaults to 50 and is capped at 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

    SearchQuery:
      name: query
      in: query
      required: false
      description: Server-side free-text search term.
      schema:
        type: string
        maxLength: 200

    SortQuery:
      name: sort
      in: query
      required: false
      description: Endpoint-specific stable sort name.
      schema:
        type: string

    UserStatusQuery:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, disabled, pending]

    EmployeeStatusQuery:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, offboarding]

    X-Reauthentication-Token:
      name: X-Reauthentication-Token
      in: header
      required: true
      description: |
        Single-use reauthentication grant issued by the reauthentication
        endpoints. Bound to the exact action and target resource; consumed
        atomically before the operation executes.
      schema:
        type: string
        minLength: 43
        maxLength: 43
        pattern: "^[A-Za-z0-9_-]{43}$"
        example: reauth_grant_opaque_token

    DreamUP-X-Reauthentication-Token:
      name: X-Reauthentication-Token
      in: header
      required: false
      description: |
        Required for every high-risk request authenticated with the native Mini
        Program bearer. It is a five-minute, single-use grant bound to the exact
        action and target and is consumed atomically before the operation. The
        existing first-party cookie website may omit this header only while its
        durable proof is bound to the same authenticated session and user,
        matches the current account security epoch, and was verified no more
        than five minutes ago. If a cookie request supplies this header, token
        rejection fails closed and never falls back to the durable proof.
      schema:
        type: string
        minLength: 43
        maxLength: 43
        pattern: "^[A-Za-z0-9_-]{43}$"
        example: reauth_grant_opaque_token

    DreamUPEventIdQuery:
      name: eventId
      in: query
      required: true
      description: Exact DreamUP event scope for the active administrator binding.
      schema:
        type: string
        minLength: 1
        maxLength: 128

    DreamUPEventIdPath:
      name: eventId
      in: path
      required: true
      description: Exact DreamUP event scope for the active administrator binding.
      schema:
        type: string
        minLength: 1
        maxLength: 128

    DreamUPContentIdPath:
      name: contentId
      in: path
      required: true
      description: Opaque DreamUP announcement content identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 160
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"

    DreamUPContactSubmissionIdPath:
      name: submissionId
      in: path
      required: true
      description: Opaque DreamUP contact-submission identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 160
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"

    IdentityAccessRequestIdPath:
      name: requestId
      in: path
      required: true
      description: Opaque restricted identity-access request ID.
      schema:
        type: string
        minLength: 1
        maxLength: 160

    IdentityAccessGrantIdPath:
      name: grantId
      in: path
      required: true
      description: Opaque time-limited restricted identity-access grant ID.
      schema:
        type: string
        minLength: 1
        maxLength: 160

    IdentityAccessStatusQuery:
      name: status
      in: query
      required: false
      description: Exact request-status filter bound into the signed cursor.
      schema:
        $ref: "#/components/schemas/IdentityAccessStatus"

    Idempotency-Key:
      name: Idempotency-Key
      in: header
      required: true
      description: Globally random mutation key. Same key and different normalized input conflicts.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{32,160}$"

    If-Match:
      name: If-Match
      in: header
      required: true
      description: Strong ETag containing the current challenge row version.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'

    DreamUP-If-Match:
      name: If-Match
      in: header
      required: true
      description: Strong DreamUP BFF resource-version ETag; use `"0"` when the resource has no prior version.
      schema:
        type: string
        pattern: '^"(0|[1-9][0-9]*)"$'

  responses:
    BadRequest:
      description: Malformed request, unknown JSON field, or invalid cursor.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid session.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DreamUPAdminUnauthorizedOrStepUp:
      description: Missing or invalid session, or a high-risk DreamUP operation requiring a fresh administrator proof. The latter always uses the stable error code `admin_stepup.required` and HTTP 401; it is never HTTP 428.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/DreamUPAuthenticationRequiredErrorResponse"
              - $ref: "#/components/schemas/DreamUPAdminStepUpRequiredErrorResponse"
    Forbidden:
      description: Session is valid but the operation is not authorized.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: |
        Resource does not exist or is not accessible by the caller. Used
        consistently for inaccessible resources (anti-enumeration).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: State conflict (duplicate name, stale version, concurrent mutation).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    FieldValidationFailed:
      description: Domain validation failed; field-level errors are returned.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      $ref: "#/components/responses/TooManyRequests"
    Locked:
      description: The challenge is temporarily locked after repeated failed verification.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PreconditionRequired:
      description: A strong If-Match challenge version is required.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server failure. No internal detail is leaked.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProviderUnavailable:
      description: |
        An upstream identity or business provider rejected or failed the call.
        For DreamUP operational routes this also covers an unavailable isolated
        feature store or a feature schema that is not yet v2-ready. The response
        carries a stable internal error class only — never raw provider details.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProviderForbidden:
      description: |
        The provider service account lacks the required permission. This is a
        server-side configuration failure, not a caller authorization denial.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    WeChatOnboardingCompleteUnauthorized:
      description: |
        The restricted onboarding challenge expired, the existing-account
        credential was wrong, or the resolved account could not authenticate.
        The password-specific code is returned only after a valid, claimed and
        rate-limited WeChat onboarding challenge.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            expired:
              value:
                error:
                  code: wechat.onboarding_expired
                  message: "微信登录流程已过期，请重新发起。"
                  requestId: req_0123456789abcdef
            existingEmailPasswordMismatch:
              value:
                error:
                  code: wechat.onboarding_email_password_mismatch
                  message: "此邮箱已存在账号，请设定原始密码以进行绑定"
                  requestId: req_0123456789abcdef
            accountValidationFailed:
              value:
                error:
                  code: session.unauthenticated
                  message: "账户验证失败，请重试。"
                  requestId: req_0123456789abcdef
    WeChatOnboardingMFAUnauthorized:
      description: The onboarding MFA challenge expired or MFA/account verification failed.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            expired:
              value:
                error:
                  code: wechat.onboarding_expired
                  message: "微信登录流程已过期，请重新发起。"
                  requestId: req_0123456789abcdef
            accountValidationFailed:
              value:
                error:
                  code: session.unauthenticated
                  message: "账户验证失败，请重试。"
                  requestId: req_0123456789abcdef
    WeChatOnboardingConflict:
      description: The WeChat identity, normalized email, target account, or mandatory verified phone cannot be linked safely. No account is selected or merged by phone.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            identityConflict:
              value:
                error:
                  code: wechat.onboarding_conflict
                  message: "无法安全绑定该账户，请检查信息或联系支持。"
                  requestId: req_0123456789abcdef
            phoneConflict:
              value:
                error:
                  code: wechat.phone_conflict
                  message: "该手机号已绑定其他统一账户，或与当前账户信息冲突；系统未自动合并，请使用原账户登录或联系支持。"
                  requestId: req_0123456789abcdef
    WeChatOnboardingPhoneRequired:
      description: A fresh server-verified getPhoneNumber proof is required. No account, challenge or session was created.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: wechat.phone_required
              message: "微信登录需要授权手机号，请重新发起。"
              requestId: req_0123456789abcdef
    WeChatPhoneConflict:
      description: The verified phone is owned by another account or differs from the linked account's authoritative phone. No automatic merge or overwrite occurred.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: wechat.phone_conflict
              message: "该手机号已绑定其他统一账户，或与当前账户信息冲突；系统未自动合并，请使用原账户登录或联系支持。"
              requestId: req_0123456789abcdef

  schemas:
    DreamUPAdminSessionResponse:
      oneOf:
        - $ref: "#/components/schemas/DreamUPAdminBrowserSessionResponse"
        - $ref: "#/components/schemas/DreamUPAdminNativeSessionResponse"

    DreamUPAdminBrowserSessionResponse:
      type: object
      additionalProperties: false
      required: [authenticated, userId, csrfToken]
      properties:
        authenticated: { type: boolean, const: true }
        userId: { type: string, minLength: 1, maxLength: 160 }
        csrfToken: { type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]{43}$", readOnly: true }

    DreamUPAdminNativeSessionResponse:
      type: object
      additionalProperties: false
      required: [authenticated, userId]
      properties:
        authenticated: { type: boolean, const: true }
        userId: { type: string, minLength: 1, maxLength: 160 }

    DreamUPAdminCapability:
      type: string
      enum:
        - event.dashboard.read
        - event.application.read_basic
        - event.application.review
        - event.application.approve_admission
        - event.application.decide
        - event.checkin.scan
        - event.contact_submission.manage
        - event.content.manage
        - event.inspection.point.read
        - event.inspection.point.manage
        - event.inspection.review
        - event.asset.read
        - event.asset.manage
        - event.asset.reservation.manage
        - event.asset.custody.transfer
        - event.asset.inventory.adjust
        - event.personal_asset.assignment.manage
        - event.asset.code.rotate
        - event.qr.print.single
        - event.qr.print.bulk

    DreamUPAdminEventCounts:
      type: object
      additionalProperties: false
      required: [total, pending, accepted, rejected]
      properties:
        total: { type: integer, format: int64, minimum: 0 }
        pending: { type: integer, format: int64, minimum: 0 }
        accepted: { type: integer, format: int64, minimum: 0 }
        rejected: { type: integer, format: int64, minimum: 0 }

    DreamUPAdminEventSummary:
      type: object
      additionalProperties: false
      required: [eventId, displayName, slug, role, capabilities, counts]
      properties:
        eventId: { type: string, minLength: 1, maxLength: 200, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$" }
        displayName: { type: string, minLength: 1, maxLength: 240 }
        slug: { type: string, minLength: 1, maxLength: 160 }
        role: { type: string, enum: [admin, senior_admin, super_admin, top_admin] }
        capabilities:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/DreamUPAdminCapability" }
        counts: { $ref: "#/components/schemas/DreamUPAdminEventCounts" }

    DreamUPAdminEventsResponse:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/DreamUPAdminEventSummary" }

    DreamUPAdminEligibilityResponse:
      type: object
      additionalProperties: false
      required: [eligible]
      properties:
        eligible: { type: boolean }

    DreamUPMutationStatusResponse:
      type: object
      additionalProperties: false
      required: [operation]
      properties:
        operation:
          type: object
          additionalProperties: false
          required: [status, requestId, responseStatus, resultVersion, updatedAt]
          properties:
            status:
              type: string
              enum: [pending, succeeded, failed, needs_operator]
            requestId:
              type: string
              pattern: "^[A-Za-z0-9._:-]{8,128}$"
            responseStatus:
              type: [integer, "null"]
              minimum: 200
              maximum: 599
            resultVersion:
              type: [integer, "null"]
              minimum: 1
            updatedAt:
              type: string
              format: date-time

    DreamUPIntroMutationRequest:
      type: object
      additionalProperties: false
      required: [title, summary, blocks, action]
      properties:
        title: { type: string }
        summary: { type: string }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/DreamUPContentBlock" }
        action:
          type: string
          enum: [save_draft, publish]

    DreamUPAnnouncementMutationRequest:
      type: object
      additionalProperties: false
      required: [title, summary, blocks, action]
      properties:
        title: { type: string }
        summary: { type: string }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/DreamUPContentBlock" }
        action:
          type: string
          enum: [save_draft, publish, archive]
        background:
          oneOf:
            - $ref: "#/components/schemas/DreamUPAnnouncementBackgroundImage"
            - type: "null"

    DreamUPContentBlock:
      oneOf:
        - type: object
          additionalProperties: false
          required: [id, type, text]
          properties:
            id: { type: string }
            type: { type: string, enum: [heading, paragraph, quote] }
            text: { type: string }
        - type: object
          additionalProperties: false
          required: [id, type, items]
          properties:
            id: { type: string }
            type: { type: string, const: bullets }
            items:
              type: array
              items: { type: string }
        - type: object
          additionalProperties: false
          required: [id, type, label, value]
          properties:
            id: { type: string }
            type: { type: string, const: stat }
            label: { type: string }
            value: { type: string }
        - type: object
          additionalProperties: false
          required: [id, type, label, action]
          properties:
            id: { type: string }
            type: { type: string, const: cta }
            label: { type: string }
            action: { type: string, enum: [apply, team, feedback, sponsor] }

    DreamUPAdminReviewAnswers:
      type: object
      additionalProperties: false
      maxProperties: 40
      description: Explicit allowlist of review-safe application fields. Restricted identity, legal and participant-private keys are rejected by the BFF even if an upstream response is misclassified.
      properties:
        city: { type: string }
        affiliation_type: { type: string }
        affiliation_name: { type: string }
        primary_role: { type: string }
        experience_level: { type: string }
        skill_tags: { type: array, maxItems: 5, items: { type: string } }
        problem_to_solve: { type: string }
        first_build_step: { type: string }
        what_you_bring: { type: string }
        collaboration_goal: { type: string }
        portfolio_urls: { type: array, maxItems: 3, items: { type: string } }
        vibe_coding_foundation: { type: string }
        last_word_to_moonstone: { type: string }
        view_on_tech_democratization: { type: string }
        when_tech_singularity: { type: string }
        ai_human_relationship: { type: string }
        team_preference: { type: string }
        existing_team_details: { type: string }
        affiliationType: { type: string, deprecated: true }
        affiliationName: { type: string, deprecated: true }
        primaryRole: { type: string, deprecated: true }
        experienceLevel: { type: string, deprecated: true }
        skillTags: { type: array, maxItems: 5, items: { type: string }, deprecated: true }
        problemToSolve: { type: string, deprecated: true }
        firstBuildStep: { type: string, deprecated: true }
        whatYouBring: { type: string, deprecated: true }
        collaborationGoal: { type: string, deprecated: true }
        portfolioUrls: { type: array, maxItems: 3, items: { type: string }, deprecated: true }
        vibeCodingFoundation: { type: string, deprecated: true }
        lastWordToMoonstone: { type: string, deprecated: true }
        viewOnTechDemocratization: { type: string, deprecated: true }
        whenTechSingularity: { type: string, deprecated: true }
        aiHumanRelationship: { type: string, deprecated: true }
        teamPreference: { type: string, deprecated: true }
        existingTeamDetails: { type: string, deprecated: true }
        organization: { type: string, deprecated: true }
        role_skills: { type: string, deprecated: true }
        motivation: { type: string, deprecated: true }

    DreamUPAdminOwnReviewMutationRequest:
      type: object
      additionalProperties: false
      required: [recommendation, note]
      properties:
        recommendation: { type: string, enum: [accept, waitlist, reject, needs_discussion] }
        note: { type: string, maxLength: 2000 }

    DreamUPAdminReviewRecord:
      type: object
      additionalProperties: false
      required: [recommendation, note, version, updatedAt]
      properties:
        recommendation: { type: string, enum: [accept, waitlist, reject, needs_discussion] }
        note: { type: string, maxLength: 2000 }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: integer, minimum: 0 }

    DreamUPAdminOwnReviewMutationResponse:
      type: object
      additionalProperties: false
      required: [review]
      properties:
        review: { $ref: "#/components/schemas/DreamUPAdminReviewRecord" }

    DreamUPAdminAdmissionConsensus:
      type: object
      additionalProperties: false
      required: [roundId, roundNumber, status, version, approvalCount, requiredApprovals, ownApproval, applicationStatus]
      properties:
        roundId: { type: [string, "null"], minLength: 1, maxLength: 160 }
        roundNumber: { type: integer, minimum: 0 }
        status: { type: string, enum: [not_started, open, finalized, cancelled] }
        version: { type: integer, minimum: 0 }
        approvalCount: { type: integer, minimum: 0, maximum: 3 }
        requiredApprovals: { type: integer, const: 3 }
        ownApproval: { type: boolean }
        applicationStatus: { type: string, enum: [submitted, under_review, accepted, waitlisted, rejected, withdrawn] }

    DreamUPAdminAdmissionConsensusResponse:
      type: object
      additionalProperties: false
      required: [consensus]
      properties:
        consensus: { $ref: "#/components/schemas/DreamUPAdminAdmissionConsensus" }

    DreamUPAdminDecisionRequest:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: { type: string, enum: [rejected, waitlisted] }
        reason: { type: string, minLength: 10, maxLength: 2000 }

    DreamUPAdminBasicApplication:
      type: object
      additionalProperties: false
      required: [id, eventId, displayHandle, status, version, reviewAnswers, submittedAt, updatedAt]
      properties:
        id: { type: string, minLength: 1, maxLength: 160 }
        eventId: { type: string, minLength: 1, maxLength: 160 }
        displayHandle: { type: string, minLength: 8, maxLength: 80 }
        status: { type: string, enum: [submitted, under_review, accepted, waitlisted, rejected, withdrawn] }
        version: { type: integer, minimum: 1 }
        reviewAnswers: { $ref: "#/components/schemas/DreamUPAdminReviewAnswers" }
        submittedAt: { type: [integer, "null"], minimum: 0 }
        updatedAt: { type: integer, minimum: 0 }

    DreamUPAdminOwnReview:
      type: object
      additionalProperties: false
      required: [recommendation, note, version]
      properties:
        recommendation: { type: string, enum: [accept, waitlist, reject, needs_discussion] }
        note: { type: string, maxLength: 2000 }
        version: { type: integer, minimum: 1 }

    DreamUPAdminApplicationDetail:
      type: object
      additionalProperties: false
      required: [application, ownReview]
      properties:
        application: { $ref: "#/components/schemas/DreamUPAdminBasicApplication" }
        ownReview:
          oneOf:
            - $ref: "#/components/schemas/DreamUPAdminOwnReview"
            - type: "null"

    DreamUPAdminReviewIdentityResponse:
      type: object
      additionalProperties: false
      required: [identity, receipt]
      properties:
        identity:
          type: object
          additionalProperties: false
          required: [userId, legalName, email, mobile]
          properties:
            userId: { type: string, pattern: '^user_[A-Za-z0-9._:-]{1,123}$' }
            legalName: { type: [string, "null"], maxLength: 120 }
            email: { type: [string, "null"], maxLength: 320 }
            mobile: { type: [string, "null"], maxLength: 40 }
        receipt:
          type: object
          additionalProperties: false
          required: [operationId, receiptHash, consumedAt]
          properties:
            operationId: { type: string, pattern: '^[A-Za-z0-9_-]{32,160}$' }
            receiptHash: { type: string, pattern: '^[a-f0-9]{64}$' }
            consumedAt: { type: integer, minimum: 1 }

    DreamUPAdminApplicationPage:
      type: object
      additionalProperties: false
      required: [applications, nextCursor]
      properties:
        applications:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/DreamUPAdminBasicApplication" }
        nextCursor: { type: [string, "null"], minLength: 45, maxLength: 2048, pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]{43}$' }

    DreamUPAdminTeamPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, name, description, status, captainDisplayHandle, memberCount, seatConfirmedCount, publicRecruiting, createdAt, members]
            properties:
              id: { type: string }
              name: { type: string }
              description: { type: string }
              status: { type: string, enum: [active, locked, dissolved] }
              captainDisplayHandle: { type: string, minLength: 8, maxLength: 80 }
              memberCount: { type: integer, minimum: 0, maximum: 5 }
              seatConfirmedCount: { type: integer, minimum: 0, maximum: 5 }
              publicRecruiting: { type: boolean }
              createdAt: { type: string, format: date-time }
              members:
                type: array
                maxItems: 5
                items:
                  type: object
                  additionalProperties: false
                  required: [displayHandle, role, seatConfirmed, joinedAt]
                  properties:
                    displayHandle: { type: string, minLength: 8, maxLength: 80 }
                    role: { type: string, enum: [captain, member] }
                    seatConfirmed: { type: boolean }
                    joinedAt: { type: string, format: date-time }
        nextCursor: { type: [string, "null"], minLength: 45, maxLength: 2048, pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]{43}$' }

    DreamUPContentResponse:
      type: object
      additionalProperties: false
      required: [intro, announcements]
      properties:
        intro:
          oneOf:
            - $ref: "#/components/schemas/DreamUPContentDocument"
            - type: "null"
        announcements:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/DreamUPContentDocument"
        nextCursor: { type: [string, "null"], minLength: 45, maxLength: 2048, pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]{43}$' }

    DreamUPContentMutationResponse:
      type: object
      additionalProperties: false
      required: [intro, announcements, mutationDocumentId]
      properties:
        intro:
          oneOf:
            - $ref: "#/components/schemas/DreamUPContentDocument"
            - type: "null"
        announcements:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/DreamUPContentDocument"
        mutationDocumentId: { type: string, minLength: 1, maxLength: 200, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$' }
        nextCursor: { type: [string, "null"], minLength: 45, maxLength: 2048, pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]{43}$' }

    DreamUPAnnouncementBackgroundImage:
      type: object
      additionalProperties: false
      required: [objectKey, contentType, byteSize, width, height, sha256]
      properties:
        objectKey:
          type: string
          minLength: 64
          maxLength: 512
          pattern: '^private/events/[A-Za-z0-9._:-]+/announcements/announcement_[A-Za-z0-9._:-]{1,115}/backgrounds/cleared/admin_image_upload_[0-9a-f]{40}[.](jpg|png)$'
          description: Private R2 key issued by the announcement-background upload-intent route and retained with each referencing revision.
        contentType: { type: string, enum: [image/jpeg, image/png] }
        byteSize: { type: integer, minimum: 1, maximum: 5242880 }
        width: { type: integer, minimum: 1, maximum: 16384 }
        height: { type: integer, minimum: 1, maximum: 16384 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }

    DreamUPContentDocument:
      type: object
      additionalProperties: false
      required: [id, kind, status, title, summary, blocks, background, version, revision, publishedAt, updatedAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [intro, announcement] }
        status: { type: string, enum: [draft, published, archived] }
        title: { type: string }
        summary: { type: string }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/DreamUPContentBlock" }
        background:
          oneOf:
            - $ref: "#/components/schemas/DreamUPAnnouncementBackgroundImage"
            - type: "null"
        version: { type: integer, minimum: 1 }
        revision: { type: integer, minimum: 1 }
        publishedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }

    DreamUPContactSubmission:
      type: object
      additionalProperties: false
      required: [id, kind, category, payload, createdAt, resolution]
      properties:
        id: { type: string }
        kind: { type: string, enum: [feedback, sponsorship] }
        category: { type: string, enum: [feedback, emergency, sponsorship] }
        payload:
          oneOf:
            - type: object
              additionalProperties: false
              required: [content]
              properties:
                content: { type: string, minLength: 10, maxLength: 4000 }
            - type: object
              additionalProperties: false
              required: [category, eventType, location, contact, details]
              properties:
                category: { type: string, const: emergency }
                eventType: { type: string }
                location: { type: string }
                contact: { type: string }
                details: { type: string }
            - type: object
              additionalProperties: false
              required: [organization, contact, intent]
              properties:
                organization: { type: string, minLength: 2, maxLength: 160 }
                contact: { type: string, minLength: 3, maxLength: 254 }
                intent: { type: string, minLength: 10, maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        resolution:
          oneOf:
            - type: object
              additionalProperties: false
              required: [status, version, note, updatedAt]
              properties:
                status: { type: string, enum: [acknowledged, closed] }
                version: { type: integer, minimum: 1 }
                note: { type: string, minLength: 2, maxLength: 1000 }
                updatedAt: { type: string, format: date-time }
            - type: "null"

    IdentityAccessField:
      type: string
      description: |
        Fixed restricted-field allowlist. Legal-document contents and legal-file
        identifiers are deliberately absent from this enum.
      enum: [legal_name, identity_number, identity_photo, contact_email, contact_mobile]

    IdentityAccessStatus:
      type: string
      enum: [pending, approved, rejected, revoked, expired]

    IdentityAccessCreateRequest:
      type: object
      additionalProperties: false
      required: [targetType, targetId, fields, reason]
      properties:
        targetType:
          type: string
          enum: [application, check_in]
        targetId:
          type: string
          minLength: 1
          maxLength: 160
          description: Opaque same-event application or check-in target.
        fields:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: {$ref: "#/components/schemas/IdentityAccessField"}
        reason:
          type: string
          writeOnly: true
          description: |
            NFKC-normalized business reason containing 20–500 UAX #29
            grapheme clusters. Stored encrypted and never returned.

    IdentityAccessDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        fields:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          description: Optional strict subset used to reduce an approval.
          items: {$ref: "#/components/schemas/IdentityAccessField"}

    IdentityAccessRequest:
      type: object
      additionalProperties: false
      required: [requestId, eventId, targetType, targetId, fields, status, version]
      properties:
        requestId: {type: string}
        eventId: {type: string}
        targetType:
          type: string
          enum: [application, check_in]
        targetId: {type: string}
        fields:
          type: array
          items: {$ref: "#/components/schemas/IdentityAccessField"}
        status: {$ref: "#/components/schemas/IdentityAccessStatus"}
        version: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}

    IdentityAccessRequestPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/IdentityAccessRequest"}
        page: {$ref: "#/components/schemas/CursorPageMetadata"}

    IdentityAccessDecisionResponse:
      type: object
      additionalProperties: false
      required: [requestId, status, version]
      properties:
        requestId: {type: string}
        status: {$ref: "#/components/schemas/IdentityAccessStatus"}
        version: {type: integer, format: int64, minimum: 1}
        replayed: {type: boolean, default: false}

    IdentityAccessClaimResponse:
      type: object
      additionalProperties: false
      required: [grantId, status, version]
      properties:
        grantId: {type: string}
        status:
          type: string
          enum: [claimed]
        version: {type: integer, format: int64, minimum: 1}
        replayed: {type: boolean, default: false}

    AdminStepUpState:
      type: string
      enum: [pending_enrollment, recovery_pending, active, must_rotate, disabled]

    AdminStepUpChallengeResponse:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: {$ref: "#/components/schemas/AdminStepUpState"}
        question:
          type: string
          description: NFKC-normalized owner-only challenge question; absent while enrollment is pending.
        version: {type: integer, format: int64, minimum: 1}
        credentialVersion: {type: integer, format: int64, minimum: 1}
        lockedUntil: {type: string, format: date-time}

    AdminStepUpEnrollRequest:
      type: object
      additionalProperties: false
      required: [eventId, question, answer]
      properties:
        eventId: {type: string, minLength: 1, maxLength: 128}
        question:
          type: string
          description: NFKC-normalized question containing 5–200 UAX #29 grapheme clusters.
        answer:
          type: string
          writeOnly: true
          description: NFKC-normalized answer containing 7–256 UAX #29 grapheme clusters after outer trim.

    AdminStepUpVerifyRequest:
      type: object
      additionalProperties: false
      required: [eventId, answer, action, target]
      properties:
        eventId: {type: string, minLength: 1, maxLength: 128}
        answer: {type: string, writeOnly: true}
        action:
          type: string
          enum:
            - event.dashboard.read
            - event.application.read_basic
            - event.application.review
            - event.application.approve_admission
            - event.application.decide
            - event.registration.manage
            - event.checkin.scan
            - event.checkin.manage_window
            - event.identity_access.request
            - event.identity_access.validate_target
            - event.identity_access.consume
            - event.identity.read_restricted
            - event.legal.read
            - event.application.export
            - event.audit.read
            - event.contact_submission.manage
            - event.content.manage
            - system.role_migration.read
            - dreamup.admin.role.manage
            - dreamup.admin.event_registry.manage
            - dreamup.admin.oa.approve
            - dreamup.admin.restricted.view
            - dreamup.admin.legal.view
            - dreamup.admin.export
            - dreamup.admin.challenge.rotate
            - dreamup.admin.checkin_window.manage
        target:
          type: string
          maxLength: 900
          description: For high-risk DreamUP BFF actions, the exact server-defined canonical JSON tuple `["dreamup-admin-target/v1", eventId, resourceKind, resourceId]`; alternate JSON spellings, cross-event tuples and action/resource-kind mismatches are rejected. Ordinary and legacy actions use their documented stable target.

    AdminStepUpRotateRequest:
      type: object
      additionalProperties: false
      required: [eventId, oldAnswer, question, answer]
      properties:
        eventId: {type: string, minLength: 1, maxLength: 128}
        oldAnswer: {type: string, writeOnly: true}
        question:
          type: string
          description: Replacement question containing 5–200 UAX #29 grapheme clusters after NFKC.
        answer:
          type: string
          writeOnly: true
          description: Replacement answer containing 7–256 UAX #29 grapheme clusters after normalization and outer trim.

    AdminStepUpMutationResponse:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: {$ref: "#/components/schemas/AdminStepUpState"}
        version: {type: integer, format: int64, minimum: 1}
        challengeVersion: {type: integer, format: int64, minimum: 1}
        verifiedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        reauthenticationToken:
          type: string
          writeOnly: true
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Newly minted action-and-target-bound single-use bearer for high-risk verification. Never returned by an idempotent replay.
        grantId:
          type: string
          description: Stable random grant identifier stored with the bearer data; it is not derived from the bearer.
        replayed: {type: boolean, default: false}

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, "not ready"]
          description: Liveness or readiness status

    WeChatRegistrationCreateRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, email, password, acceptedTerms, loginCode, phoneCode]
      properties:
        username: {type: string, minLength: 3, maxLength: 64}
        displayName: {type: string, minLength: 1, maxLength: 100}
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, writeOnly: true, minLength: 12, maxLength: 128}
        acceptedTerms: {type: boolean, enum: [true]}
        requestId:
          type: string
          maxLength: 200
          description: Optional correlation value copied into the email-verification return link; it is not an idempotency key or replay receipt.
        loginCode:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 2048
        phoneCode:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 2048

    WeChatOnboardingBeginRequest:
      type: object
      additionalProperties: false
      required: [loginCode, phoneCode]
      properties:
        loginCode:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 2048
          description: Fresh `wx.login` one-time code; the server derives the AppID-scoped subject.
        phoneCode:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 2048
          description: Fresh mandatory `getPhoneNumber` code. Absence, rejection or provider failure creates no account, challenge or session.

    WeChatOnboardingRequiredResponse:
      type: object
      additionalProperties: false
      required: [status, onboardingToken, expiresAt]
      properties:
        status: {type: string, enum: [onboarding_required]}
        onboardingToken:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Restricted, single-use account-setup challenge. It is not a United Pass session bearer.
        expiresAt: {type: string, format: date-time}

    WeChatOnboardingCompleteRequest:
      type: object
      additionalProperties: false
      required: [onboardingToken, email, password, acceptedTerms]
      properties:
        onboardingToken:
          type: string
          writeOnly: true
          pattern: "^[A-Za-z0-9_-]{43}$"
        username:
          type: string
          maxLength: 64
          description: Optional/empty for existing-account binding. Required and validated only when a new account is created; never overwrites an existing account.
        displayName:
          type: string
          maxLength: 100
          description: Optional/empty for existing-account binding. Required and validated only when a new account is created; never overwrites an existing account.
        email: {type: string, format: email, maxLength: 254}
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
          description: New credential for a new email, or current credential proof for an existing account. It is never persisted by United Pass.
        acceptedTerms: {type: boolean, enum: [true]}
        requestId:
          type: string
          maxLength: 200
          description: Optional correlation value copied into a new account's email-verification return link; it is not an idempotency key or replay receipt.

    WeChatOnboardingVerificationRequiredResponse:
      type: object
      additionalProperties: false
      required: [status, registrationToken, expiresAt]
      properties:
        status: {type: string, enum: [verification_required]}
        registrationToken:
          type: string
          description: Short-lived opaque capability for the existing registration email lifecycle; not an account session.
        expiresAt: {type: string, format: date-time}

    WeChatOnboardingMFARequiredResponse:
      type: object
      additionalProperties: false
      description: |
        The existing account requires its registered second factor before the
        verified WeChat identity can be linked. `mfaToken` is a dedicated,
        single-use onboarding token and must be submitted only to
        `POST /api/v1/auth/wechat/onboarding/mfa`. The current DreamUP Mini
        Program UI completes TOTP and fails closed for unsupported methods.
      required: [status, mfaToken, availableMethods, expiresAt]
      properties:
        status: {type: string, enum: [mfa_required]}
        mfaToken:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Opaque five-minute onboarding MFA token; it contains no provider credential.
        availableMethods:
          type: array
          minItems: 1
          items: {type: string, enum: [totp, passkey, recovery_code]}
        passkeyRequestOptions:
          type: object
          additionalProperties: true
          description: Provider WebAuthn request options when passkey is available; absent for TOTP-only accounts.
        expiresAt: {type: string, format: date-time}

    WeChatOnboardingMFARequest:
      type: object
      additionalProperties: false
      required: [mfaToken, method]
      properties:
        mfaToken:
          type: string
          writeOnly: true
          pattern: "^[A-Za-z0-9_-]{43}$"
        method:
          type: string
          enum: [totp, passkey, recovery_code]
        code:
          type: string
          writeOnly: true
          maxLength: 256
        passkeyAssertion:
          type: object
          writeOnly: true
          additionalProperties: true

    WeChatPhoneBindRequest:
      type: object
      additionalProperties: false
      required: [loginCode, phoneCode]
      properties:
        loginCode:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 2048
          description: Fresh `wx.login` code proving the linked WeChat identity.
        phoneCode:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 2048
          description: Fresh `getPhoneNumber` code. Never treated as a phone number.

    WeChatPhoneBindResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [verified]}

    DreamUPAuthenticationRequiredErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, const: authentication_required }
            message: { type: string }
            requestId: { type: string }

    DreamUPAdminStepUpRequiredErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, const: admin_stepup.required }
            message: { type: string }
            requestId: { type: string }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code
          examples:
            internal: internal.unexpected
            validation: validation.failed
            reauth: session.reauthentication_required
        message:
          type: string
          description: Safe, user-displayable message
          example: "服务暂时无法处理该请求。"
        requestId:
          type: string
          description: Request ID for troubleshooting and audit correlation
          example: req_0123456789abcdef
        fieldErrors:
          type: array
          description: Field-level validation errors (array format)
          items:
            $ref: "#/components/schemas/FieldError"
        stepUp:
          $ref: "#/components/schemas/StepUpDetails"

    StepUpDetails:
      type: object
      additionalProperties: false
      required: [challengeToken, level, method, expiresAt, providerReady, completionPath]
      properties:
        challengeToken: {type: string, minLength: 1}
        level: {type: string, enum: [medium, high]}
        method: {type: string, enum: [automation_cost, interactive_captcha, mfa, reauth]}
        expiresAt: {type: string, format: date-time}
        algorithm:
          type: string
          enum: [sha256_leading_zero_bits]
          description: Present only for automation_cost; this is not human verification.
        difficulty: {type: integer, minimum: 1, maximum: 30}
        provider:
          type: string
          description: |
            Server-selected identifier. Current interactive values are
            `moonstone_image_digits`, `cloudflare_turnstile`, and
            `google_recaptcha`; clients cannot choose or override this value.
        providerReady:
          type: boolean
          description: False means high-risk verification is fail-closed until a provider is configured.
        providerPayload:
          type: object
          additionalProperties: true
          description: |
            Server-issued public SDK parameters. Turnstile uses exactly
            `siteKey`, `action`, and `cdata`; reCAPTCHA uses exactly `siteKey`
            and the unique per-challenge `action`; the first-party provider
            uses exactly a bounded inline raster PNG `imageDataUrl` and a
            digit count. No answer, provider secret, or remote URL is returned.
        completionPath:
          type: string
          enum: [/api/v1/auth/step-up, /api/v1/auth/sessions/mfa, /api/v1/auth/reauthentication]
          description: Exact same-origin endpoint that completes the selected method.

    StepUpCompletionRequest:
      type: object
      additionalProperties: false
      required: [challengeToken]
      properties:
        challengeToken: {type: string, minLength: 1, maxLength: 512, writeOnly: true}
        nonce:
          type: string
          maxLength: 256
          description: automation_cost nonce; omitted for interactive_captcha.
        providerProof:
          type: string
          maxLength: 8192
          writeOnly: true
          description: Opaque interactive-provider proof; omitted for automation_cost.

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: The field that failed validation
          example: redirectUris[0]
        message:
          type: string
          description: Safe, user-displayable field error message
          example: "该重定向地址未登记。"

    RegistrationCreateRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, email, password, acceptedTerms, formIntentToken, automationBrief]
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$"
        displayName: {type: string, minLength: 1, maxLength: 100}
        email: {type: string, format: email, maxLength: 254}
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
        acceptedTerms: {type: boolean, const: true}
        requestId: {type: string, maxLength: 200}
        formIntentToken:
          type: string
          minLength: 1
          maxLength: 512
          writeOnly: true
          description: One-use server-issued registration form intent.
        automationBrief:
          type: string
          maxLength: 0
          writeOnly: true
          description: Must be present and empty in the supported browser client.

    RegistrationFormIntentResponse:
      type: object
      additionalProperties: false
      required: [formIntentToken, expiresAt]
      properties:
        formIntentToken: {type: string, minLength: 1, maxLength: 512}
        expiresAt: {type: string, format: date-time}

    RegistrationCreateResponse:
      type: object
      additionalProperties: false
      required: [status, registrationToken, expiresAt]
      properties:
        status: {type: string, const: verification_required}
        registrationToken:
          type: string
          minLength: 1
          description: Returned only after the mandatory image challenge and account creation; usable solely to resend this registration's verification email.
        expiresAt: {type: string, format: date-time}

    RegistrationVerifyRequest:
      type: object
      additionalProperties: false
      required: [userId, code]
      properties:
        userId: {type: string, pattern: "^user_[0-9a-f]{32}$"}
        code: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
        requestId: {type: string, maxLength: 200}

    RegistrationVerifyResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, const: verified}
        requestId:
          type: string
          maxLength: 200
          description: Validated authorization request ID to restore through `/login?requestId=`.

    RegistrationResendRequest:
      type: object
      additionalProperties: false
      required: [registrationToken]
      properties:
        registrationToken: {type: string, minLength: 1, maxLength: 512, writeOnly: true}

    RegistrationResendResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, const: verification_sent}

    RegistrationAbuseBlockRevokeRequest:
      type: object
      additionalProperties: false
      required: [dimension, value, valueEncoding, reasonCode]
      properties:
        dimension:
          type: string
          enum: [device, ip]
        value:
          type: string
          minLength: 1
          maxLength: 64
          writeOnly: true
          description: Canonical IP address, exact server-issued 256-bit base64url risk-device token, or its audited digest when allowed by valueEncoding.
        valueEncoding:
          type: string
          enum: [raw, sha256]
          description: sha256 is accepted only with dimension=device; IP always uses raw canonicalization and boundary hashing.
        reasonCode:
          type: string
          enum: [false_positive, support_verified, test_cleanup, incident_response]
      allOf:
        - if:
            required: [dimension]
            properties:
              dimension: {const: ip}
          then:
            properties:
              valueEncoding: {const: raw}
        - if:
            required: [valueEncoding]
            properties:
              valueEncoding: {const: sha256}
          then:
            properties:
              dimension: {const: device}
              value: {type: string, pattern: "^[0-9a-f]{64}$"}

    LoginRequest:
      type: object
      description: |
        Credentials used to establish a browser session. `identifier` accepts
        either an account name or an email address. Authentication failures
        return generic errors that do not reveal which value was incorrect.
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier:
          type: string
          minLength: 1
          description: Account name or email address used to identify the user.
          example: zhixing.lin
        password:
          type: string
          minLength: 1
          format: password
          description: User-entered password. Never logged or persisted in plaintext.
          writeOnly: true
        remember:
          type: boolean
          default: false
          description: |
            When true, the session cookie is issued with an extended lifetime
            suitable for a "remember me" experience. When false or omitted, the
            session uses the default browser-session lifetime.
        resumeRequestId:
          type: string
          description: |
            Opaque server-issued authorization transaction ID to resume after
            successful login. When present and valid, login redirects to the
            authorization resume flow instead of the default account or admin
            destination. Only an opaque server-issued ID is accepted — never a
            raw return URL.
          pattern: "^[a-zA-Z0-9_:-]{8,128}$"
          example: req_01ABCdefGHIjkl

    MiniProgramLoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 1
          description: Account name or email address.
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
        remember:
          type: boolean
          const: false
          default: false
          description: Native Mini Program sessions cannot opt into the extended remember lifetime.

    MiniProgramSessionResponse:
      type: object
      additionalProperties: false
      required: [status, sessionBearer, expiresAt]
      properties:
        status:
          type: string
          const: authenticated
        sessionBearer:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          readOnly: true
          description: Short-lived opaque native bearer. Keep only in process memory and never persist it.
        expiresAt:
          type: string
          format: date-time
          readOnly: true
          description: Fixed server-side absolute expiry, no later than 30 minutes after issuance.

    DreamUPMobileAssertionResponse:
      type: object
      additionalProperties: false
      required: [assertion, expiresAt]
      properties:
        assertion:
          type: string
          minLength: 1
          readOnly: true
          description: One short-lived request-bound DreamUP assertion; it is not a United Pass session credential.
        expiresAt:
          type: string
          format: date-time
          readOnly: true

    MiniProgramMFAChallengeRequest:
      type: object
      additionalProperties: false
      required: [mfaToken, method, code]
      properties:
        mfaToken:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          writeOnly: true
        method:
          type: string
          const: totp
        code:
          type: string
          pattern: "^[0-9]{6}$"
          writeOnly: true

    MFARequiredResponse:
      type: object
      description: |
        Returned when the account requires multi-factor authentication before a
        session can be established. The `mfaToken` is an opaque, randomly
        generated United Pass token — it never contains provider credentials —
        and must be submitted to `POST /api/v1/auth/sessions/mfa`.
      required: [status, mfaToken, availableMethods, expiresAt]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [mfa_required]
          description: Indicates that MFA is required to continue.
        mfaToken:
          type: string
          minLength: 1
          description: |
            Opaque, short-lived token used to complete the MFA challenge. It is
            generated server-side and never embeds provider session credentials.
          example: opaque_mfa_token
        availableMethods:
          type: array
          description: MFA methods the user may use to complete the challenge.
          items:
            type: string
            enum: [totp, passkey, recovery_code]
          example: [totp, passkey, recovery_code]
        passkeyRequestOptions:
          type: object
          description: |
            WebAuthn PublicKeyCredentialRequestOptions returned when `passkey`
            is among the available methods. The browser must pass it to
            `navigator.credentials.get()` and submit the resulting assertion
            as `passkeyAssertion` to the MFA endpoint.
          example:
            publicKey:
              challenge: "abc123"
              rpId: login.example.com
              timeout: 60000
        expiresAt:
          type: string
          format: date-time
          description: |
            ISO 8601 UTC timestamp after which the `mfaToken` is no longer
            accepted.
          example: "2026-08-05T12:05:30Z"

    MFAChallengeRequest:
      type: object
      description: |
        Submission of an MFA verification code or assertion to complete a
        challenge started by `POST /api/v1/auth/sessions`. The payload depends
        on `method`: `totp` requires `code`; `passkey` requires
        `passkeyAssertion`; `recovery_code` is not supported in Phase 1.2.
      required: [mfaToken, method]
      additionalProperties: false
      properties:
        mfaToken:
          type: string
          minLength: 1
          description: Opaque MFA token returned in the login `202` response.
          example: opaque_mfa_token
        method:
          type: string
          enum: [totp, passkey, recovery_code]
          description: The MFA method being used to satisfy the challenge.
          example: totp
        code:
          type: string
          minLength: 1
          description: |
            User-entered verification value. Required for `totp` (a 6-digit
            code). Never logged.
          writeOnly: true
          example: "123456"
        passkeyAssertion:
          type: object
          description: |
            The WebAuthn assertion returned by `navigator.credentials.get()`,
            submitted verbatim. Required for `passkey`. Never logged.
          writeOnly: true
          example:
            id: assertion-id
            rawId: "base64"
            response:
              authenticatorData: "base64"
              signature: "base64"
              clientDataJSON: "base64"

    UserPersona:
      type: string
      enum: [consumer, employee]
      description: |
        A persona attached to a stable United Pass user. An external user who
        becomes an employee keeps the same `userId` and retains the consumer
        persona.

    EmployeeProfile:
      type: object
      description: |
        Employee profile linked to the stable user identity. Optional and kept
        as historical display/audit data after offboarding; it is never a
        second account.
      required: [employeeId, departmentName, title]
      additionalProperties: false
      properties:
        employeeId:
          type: string
          description: Employee number unique within its scope.
          example: EMP-10032
        departmentName:
          type: string
          description: Display name of the employee's department.
          example: 平台架构部
        title:
          type: string
          description: Employee position or title.
          example: 高级工程师

    CurrentUser:
      type: object
      description: |
        Profile of the authenticated user. The `userId` is the stable United
        Pass identity primary key — not an email, phone number or external
        Provider identifier. `employeeProfile` is present when an employee
        profile exists, including historical offboarding profiles.
      required: [userId, displayName, email, phoneMasked, personas]
      additionalProperties: false
      properties:
        userId:
          type: string
          description: Stable United Pass user ID, used as the OIDC subject.
          example: usr_01HQFGXKN8H2C4JVMW7K3R4D8Z
        displayName:
          type: string
          description: User-facing display name.
          example: 林知行
        nickname:
          type: string
          nullable: true
          description: Optional user-chosen nickname.
          example: 知行
        avatarUrl:
          type: string
          format: uri
          nullable: true
          description: |
            Same-origin or controlled media domain URL of the user's avatar.
            Stored after server-side validation, re-encoding and metadata
            stripping. The frontend never submits an external image URL.
          example: https://cdn.example.com/avatars/usr_01HQFGXKN8H2C4JVMW7K3R4D8Z.webp
        email:
          type: string
          format: email
          description: Verified or primary email address.
          example: zhixing.lin@example.com
        phoneMasked:
          type: string
          description: Masked phone number safe for user display.
          example: "+86 138****0123"
        personas:
          type: array
          description: Personas attached to the user identity.
          items:
            $ref: "#/components/schemas/UserPersona"
          example: [consumer, employee]
        employeeProfile:
          allOf:
            - $ref: "#/components/schemas/EmployeeProfile"
          nullable: true
          description: Employee profile, including historical offboarding state.

    PermissionCapabilities:
      type: object
      description: |
        User-experience permission summary computed from authoritative backend
        attributes and Cerbos decisions. These capabilities drive frontend
        navigation visibility and control availability only. Every protected
        backend operation must independently authorize via Cerbos; frontend
        checks are not security controls.
      required:
        - userRead
        - userDisable
        - employeeManage
        - employeeOffboard
        - departmentManage
        - applicationRead
        - applicationManage
        - applicationSecretRotate
        - policyRead
        - policyManage
        - policyPublish
        - auditRead
        - auditExport
        - providerRead
        - providerManage
      additionalProperties: false
      properties:
        userRead:
          type: boolean
          description: May read managed user listings and user detail.
        userDisable:
          type: boolean
          description: May disable or enable users and revoke their sessions.
        employeeManage:
          type: boolean
          description: May create, link and update employee profiles.
        employeeOffboard:
          type: boolean
          description: May start employee offboarding and revoke access.
        departmentManage:
          type: boolean
          description: May create, update and delete departments.
        applicationRead:
          type: boolean
          description: May read OAuth application and client metadata.
        applicationManage:
          type: boolean
          description: May create, update and delete applications and clients.
        applicationSecretRotate:
          type: boolean
          description: May rotate confidential client secrets.
        policyRead:
          type: boolean
          description: May read authorization policies and versions.
        policyManage:
          type: boolean
          description: May create and update policy drafts.
        policyPublish:
          type: boolean
          description: May publish a policy version.
        auditRead:
          type: boolean
          description: May query and filter audit events.
        auditExport:
          type: boolean
          description: May create and download audit export jobs.
        providerRead:
          type: boolean
          description: May read identity provider metadata.
        providerManage:
