      description: Requires the high-risk `event.contact_submission.manage` capability and a fresh five-minute administrator proof. Native Mini Program bearer callers require an action-and-target-bound one-shot token; the existing cookie website may use its session-bound durable proof. Generic audit-read authority is insufficient. Results are audit-logged before disclosure.
      security: [{ SessionCookie: [] }, { MiniProgramBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/DreamUP-X-Reauthentication-Token"
        - name: kind
          in: query
          schema: { type: string, enum: [feedback, sponsorship] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
