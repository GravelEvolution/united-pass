    PasskeyEnrollmentConfirmRequest:
      type: object
      required: [enrollmentToken, publicKeyCredential]
      additionalProperties: false
      properties:
        enrollmentToken:
          type: string
          minLength: 1
        publicKeyCredential:
          type: object
          writeOnly: true
          description: Browser-created credential JSON. Never logged or persisted.
        passkeyName:
          type: string
          maxLength: 200

    PasskeyEnrollmentCancelRequest:
      type: object
      required: [enrollmentToken]
      additionalProperties: false
      properties:
        enrollmentToken:
          type: string
          minLength: 1
          writeOnly: true

    PasskeyEnrollmentConfirmation:
      type: object
