  /api/v1/admin/applications/with-initial-client:
    post:
      tags: [Admin Applications]
      summary: Create an application together with its initial OAuth client
      description: |
        The only creation path in Phase 2. The application and its initial
        client are provisioned atomically from the API consumer's view:
        local rows are committed first (`provisioning`), the provider call
        runs outside any database transaction, then provider identifiers and
        the one-time client secret are recorded. Provider failures return a
        safe 5xx; local metadata for a failed provisioning is never exposed
        as active. Standalone application creation without a client is not
        supported.
      operationId: createApplicationWithInitialClient
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationWithInitialClientRequest"
      responses:
        "201":
          description: |
            Application and initial client created. For confidential clients
            the `clientSecret` appears exactly once in this response
            (`Cache-Control: no-store`).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Cache-Control:
              description: Always `no-store` when a secret is included.
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationWithInitialClientResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/FieldValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/applications:
    get:
      tags: [Admin Applications]
      summary: List OAuth applications (cursor pagination)
      description: |
        Cursor-paginated, server-side filtered listing. Cursors are opaque
        HMAC-signed values bound to the current sort and filters; tampered
        cursors return 400. Only applications in a fully provisioned state
        are returned.
      operationId: listAdminApplications
      security:
        - SessionCookie: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a previous response.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size (1–100, default 20).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: query
          in: query
          required: false
          description: Server-side name/description search.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: |
            Sort key, `-` prefix for descending. Default `-updatedAt`.
            Stable ordering always appends the ID tie-breaker.
          schema:
            type: string
            enum: [updatedAt, -updatedAt, createdAt, -createdAt, name, -name]
            default: -updatedAt
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, disabled]
        - name: audience
          in: query
          required: false
          schema:
            type: string
            enum: [internal, external, hybrid]
        - name: ownerId
          in: query
          required: false
          description: Filter by owner user ID.
          schema:
            type: string
      responses:
        "200":
          description: Application page
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

