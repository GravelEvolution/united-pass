        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IdentityAccessCreateRequest"}
      responses:
        "201":
          description: Request created or safely replayed.
          headers:
            X-Request-ID: {$ref: "#/components/headers/X-Request-ID"}
            ETag:
              description: Strong request-row version.
              schema: {type: string}
