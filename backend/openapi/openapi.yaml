  /api/v1/me/security/password:
    post:
      tags: [Account Security]
      summary: Change the current user's password after step-up
      description: |
        Consumes an `account.password.change` grant. The reauthentication
        request is the sole current-password proof; this body accepts only
        `newPassword`. On success the current credential is rotated and all
        older-generation sessions are revoked (ADR-0007). Browser callers get
        rotated HttpOnly cookies and `204`; native bearer callers get the fresh
        bearer once in a `200` response.
      operationId: changeOwnPassword
      security:
        - SessionCookie: []
        - MiniProgramBearer: []
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/X-MiniProgram-Client-When-Bearer"
        - $ref: "#/components/parameters/X-Reauthentication-Token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "200":
          description: Password changed and the native bearer was rotated; no cookie is emitted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MiniProgramSessionResponse"}
        "204":
          description: Password changed and the current session was rotated.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/Set-Session-Cookies"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Session invalid or committed outcome requires re-login; cookies are cleared where applicable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

