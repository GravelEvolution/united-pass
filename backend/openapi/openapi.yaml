openapi: 3.1.0

info:
  title: United Pass Backend API
  description: |
    United Pass is a unified identity, account, organization, OAuth application,
    authorization, Provider synchronization and audit platform.

    This OpenAPI specification is the machine-readable contract. The human-readable
    detail lives in `frontend/docs/api-contracts.md`. Both must stay synchronized.

    Phase 0 scope: operational endpoints only.
    Phase 1 scope: session establishment, MFA, logout, current user and
    permission capabilities.
    Phase 2 scope: OAuth application and client management plane (scope
    catalog, application/client lifecycle, secret rotation, reauthentication).
    See `../docs/adr-0004.md` for the architecture decisions.

    Business API paths use the full `/api/v1/...` prefix explicitly rather than
    relying on a global server base path, so that root-level operational endpoints
    and versioned API endpoints can coexist accurately.
  version: 0.3.0
  contact:
    name: United Pass backend team

servers:
  - url: http://localhost:8080
    description: Local development
  - url: /
    description: Same-origin production

tags:
  - name: Operational
    description: Health and readiness endpoints
  - name: Session
    description: |
      Browser session establishment, MFA challenge completion and logout.
      Sessions are carried by the `up_session` HttpOnly cookie; state-changing
      operations require the `X-CSRF-Token` header matching the `up_csrf` cookie.
  - name: Account
    description: Current user profile and permission capabilities
  - name: Reauthentication
    description: |
      High-risk operation reauthentication. A completed grant is required
      (single-use, action-bound, session-bound) before delete or secret
      rotation operations execute.
  - name: Scope Catalog
    description: Backend-authoritative OAuth scope catalog
  - name: Admin Applications
    description: |
      OAuth application management plane. All mutating operations require
      session + CSRF + server-side authorization; deleting an application
      additionally requires a reauthentication grant. Provider identifiers
      never appear in responses.
  - name: Admin OAuth Clients
    description: |
      OAuth client management nested under its owning application. Every
      nested route asserts `client.applicationId == path.applicationId`
      (404 on mismatch, anti-enumeration). Secret rotation requires the
      `application.secret.rotate` permission plus a reauthentication grant;
      the new secret is returned exactly once with `Cache-Control: no-store`.

paths:
  /healthz:
    get:
      tags: [Operational]
      summary: Process liveness
      description: |
        Reports that the process is alive and able to respond. This endpoint must
        not depend on downstream services so it remains useful during outages.
      operationId: getHealthz
      responses:
        "200":
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok

  /readyz:
    get:
      tags: [Operational]
      summary: Process readiness
      description: |
        Reports whether the process is ready to serve traffic. All registered
        readiness checks must pass. Failures return 503 without leaking
        dependency names or error text.
      operationId: getReadyz
      responses:
        "200":
          description: Process is ready
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ready
        "503":
          description: At least one readiness check failed
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: not ready

  /api/v1/auth/sessions:
    post:
      tags: [Session]
      summary: Establish a browser session
      description: |
        Authenticates the caller with a unified identifier (account name or email)
        and password, then establishes a browser session.

        On success the server issues two cookies:
          * `up_session` — HttpOnly, Secure, SameSite session cookie.
          * `up_csrf`   — CSRF token cookie readable by browser JavaScript.

        Both cookies are returned via `Set-Cookie`. The browser must not receive
        raw authentication-provider Refresh Tokens or long-lived tokens.

        When the account requires multi-factor authentication, the server responds
        `202` with an opaque `mfaToken` and the list of available methods instead
        of establishing the session. The MFA challenge is completed via
        `POST /api/v1/auth/sessions/mfa`.

        Authentication failures return generic errors that do not reveal whether
        the account, email or phone number exists. Passwords are never logged.

        Rate limited. Repeated failures return `429` with a `Retry-After` header.
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              credentials:
                value:
                  identifier: zhixing.lin
                  password: user-entered-password
                  remember: true
              resumeAuthorization:
                value:
                  identifier: zhixing.lin
                  password: user-entered-password
                  remember: false
                  resumeRequestId: req_01ABCdefGHIjkl
      responses:
        "204":
          description: |
            Session established successfully. No response body. The
            `up_session` and `up_csrf` cookies are set.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Set-Cookie:
              $ref: "#/components/headers/Set-Session-Cookies"
        "202":
          description: |
            Multi-factor authentication is required before the session can be
            established. The caller must complete the challenge at
            `POST /api/v1/auth/sessions/mfa`.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFARequiredResponse"
              example:
                status: mfa_required
                mfaToken: opaque_mfa_token
                availableMethods: [totp, passkey, recovery_code]
                expiresAt: "2026-08-05T12:05:30Z"
        "400":
          description: Malformed request body or missing required fields.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: validation.failed
                  message: "请求参数有误，请检查后重试。"
                  requestId: req_0123456789abcdef
                  fieldErrors:
                    - field: identifier
                      message: "该字段不能为空。"
        "401":
          description: |
            Invalid credentials. The response is generic and does not reveal
            whether the identifier corresponds to an existing account.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: auth.invalid_credentials
                  message: "账户名、邮箱或密码错误。"
                  requestId: req_0123456789abcdef
        "413":
          description: Request body exceeds the configured maximum size.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: request.too_large
                  message: "请求体过大。"
                  requestId: req_0123456789abcdef
        "429":
          description: |
            Too many login attempts. The caller must wait before retrying.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Retry-After:
              $ref: "#/components/headers/Retry-After"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: auth.rate_limited
                  message: "尝试次数过多，请稍后再试。"
                  requestId: req_0123456789abcdef
        "500":
          description: Unexpected server failure.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: internal.unexpected
                  message: "服务暂时无法处理该请求。"
                  requestId: req_0123456789abcdef

  /api/v1/auth/sessions/mfa:
    post:
      tags: [Session]
      summary: Complete a multi-factor authentication challenge
      description: |
        Submits a verification code or assertion to complete an MFA challenge
        started by `POST /api/v1/auth/sessions`.

        The `mfaToken` is the opaque token returned in the `202` login response.
        It is short-lived and single-use per attempt. Excessive failed attempts
        result in temporary lockout (`429`).

        On success the server issues the `up_session` and `up_csrf` cookies,
        identical to a successful password-only login.

        Rate limited.
      operationId: completeSessionMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAChallengeRequest"
            example:
              mfaToken: opaque_mfa_token
              method: totp
              code: "123456"
      responses:
        "204":
          description: |
            MFA challenge completed and session established successfully. No
            response body. The `up_session` and `up_csrf` cookies are set.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Set-Cookie:
              $ref: "#/components/headers/Set-Session-Cookies"
        "400":
          description: Malformed request body or missing required fields.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: validation.failed
                  message: "请求参数有误，请检查后重试。"
                  requestId: req_0123456789abcdef
                  fieldErrors:
                    - field: code
                      message: "请输入 6 位数字验证码。"
        "401":
          description: |
            The MFA token is invalid, expired, or the submitted code is wrong.
            The response is generic and does not reveal which condition failed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: auth.mfa_challenge_failed
                  message: "验证失败，请检查后重试。"
                  requestId: req_0123456789abcdef
        "429":
          description: |
            Too many MFA attempts. The challenge is temporarily locked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Retry-After:
              $ref: "#/components/headers/Retry-After"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: auth.rate_limited
                  message: "尝试次数过多，请稍后再试。"
                  requestId: req_0123456789abcdef
        "500":
          description: Unexpected server failure.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: internal.unexpected
                  message: "服务暂时无法处理该请求。"
                  requestId: req_0123456789abcdef

  /api/v1/auth/session:
    delete:
      tags: [Session]
      summary: Revoke the current browser session (logout)
      description: |
        Revokes the server-side session bound to the `up_session` cookie and
        instructs the browser to discard both the `up_session` and `up_csrf`
        cookies by setting them with `Max-Age=0`.

        Requires a valid session cookie and a matching `X-CSRF-Token` header.
        The CSRF token must equal the value of the `up_csrf` cookie.
      operationId: deleteSession
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
      responses:
        "204":
          description: |
            Session revoked successfully. No response body. The `up_session`
            and `up_csrf` cookies are cleared.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Set-Cookie:
              $ref: "#/components/headers/Clear-Session-Cookies"
        "401":
          description: No valid session cookie was supplied.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: auth.unauthenticated
                  message: "请先登录后再继续。"
                  requestId: req_0123456789abcdef
        "403":
          description: |
            CSRF validation failed. The `X-CSRF-Token` header is missing or does
            not match the `up_csrf` cookie.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: csrf.validation_failed
                  message: "跨站请求验证失败，请刷新页面后重试。"
                  requestId: req_0123456789abcdef
        "500":
          description: Unexpected server failure.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: internal.unexpected
                  message: "服务暂时无法处理该请求。"
                  requestId: req_0123456789abcdef

  /api/v1/me:
    get:
      tags: [Account]
      summary: Get the current user
      description: |
        Returns the profile of the authenticated user bound to the `up_session`
        cookie.

        The stable United Pass `userId` is the identity primary key. It is not
        an email, phone number or external Provider identifier, and it does not
        change when an external user becomes an employee.

        `employeeProfile` is optional and present only when the user has an
        active employee persona. When an external user is linked to an employee
        profile, the same `userId` is preserved and the consumer persona
        remains.

        Responses must not be cached.
      operationId: getCurrentUser
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Current user profile.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Cache-Control:
              description: Prevents the browser and intermediaries from caching the response.
              schema:
                type: string
                enum: [no-store]
                default: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
              example:
                userId: usr_01HQFGXKN8H2C4JVMW7K3R4D8Z
                displayName: 林知行
                nickname: 知行
                avatarUrl: https://cdn.example.com/avatars/usr_01HQFGXKN8H2C4JVMW7K3R4D8Z.webp
                email: zhixing.lin@example.com
                phoneMasked: "+86 138****0123"
                personas: [consumer, employee]
                employeeProfile:
                  employeeId: EMP-10032
                  departmentName: 平台架构部
                  title: 高级工程师
        "401":
          description: No valid session cookie was supplied.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: auth.unauthenticated
                  message: "请先登录后再继续。"
                  requestId: req_0123456789abcdef
        "500":
          description: Unexpected server failure.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: internal.unexpected
                  message: "服务暂时无法处理该请求。"
                  requestId: req_0123456789abcdef

  /api/v1/me/permissions:
    get:
      tags: [Account]
      summary: Get current user permission capabilities
      description: |
        Returns the permission capabilities computed for the authenticated user
        from authoritative backend attributes (employee status, department,
        ownership, etc.) and Cerbos policy decisions.

        These capabilities are a user-experience summary only — they drive
        frontend navigation visibility and control availability. Every
        protected backend operation must independently authenticate, load
        authoritative attributes, authorize via Cerbos, enforce the decision
        and audit the operation. Frontend permission checks are not security
        controls.

        Responses must not be cached.
      operationId: getCurrentPermissions
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Current user permission capabilities.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Cache-Control:
              description: Prevents the browser and intermediaries from caching the response.
              schema:
                type: string
                enum: [no-store]
                default: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionCapabilities"
              example:
                userRead: true
                userDisable: false
                employeeManage: true
                employeeOffboard: false
                departmentManage: false
                applicationRead: true
                applicationManage: false
                applicationSecretRotate: false
                policyRead: true
                policyManage: false
                policyPublish: false
                auditRead: true
                auditExport: false
                providerRead: true
                providerManage: false
        "401":
          description: No valid session cookie was supplied.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: auth.unauthenticated
                  message: "请先登录后再继续。"
                  requestId: req_0123456789abcdef
        "500":
          description: Unexpected server failure.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: internal.unexpected
                  message: "服务暂时无法处理该请求。"
                  requestId: req_0123456789abcdef

  /api/v1/auth/reauthentication:
    post:
      tags: [Reauthentication]
      summary: Reauthenticate the current session user for a high-risk action
      description: |
        Verifies the current session user's password for the declared action
        (and optional target resource). Returns the grant immediately, or a
        `202` challenge when a second factor must complete the verification.
        Challenges are random opaque IDs bound to user + session + action,
        with a short TTL and attempt limit. Redis loss only invalidates
        challenges (fail closed).
      operationId: requestReauthentication
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthenticationRequest"
      responses:
        "200":
          description: Reauthentication succeeded; single-use grant issued.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReauthenticationGrantResponse"
        "202":
          description: Second factor required to complete reauthentication.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReauthenticationChallengeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/reauthentication/mfa:
    post:
      tags: [Reauthentication]
      summary: Complete a reauthentication challenge with a second factor
      description: |
        Completes the challenge started by `POST /api/v1/auth/reauthentication`
        using TOTP or passkey (same atomic claim/consume pattern as login
        MFA). On success a single-use grant is issued.
      operationId: completeReauthenticationMfa
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthenticationMfaRequest"
      responses:
        "200":
          description: Challenge completed; single-use grant issued.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReauthenticationGrantResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/scopes:
    get:
      tags: [Scope Catalog]
      summary: List the authoritative OAuth scope catalog
      description: |
        Returns the backend-authoritative scope catalog. Arbitrary unregistered
        scopes are never accepted on client creation (422).
      operationId: getAdminScopes
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Scope catalog
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScopeCatalogItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/applications/with-initial-client:
    post:
      tags: [Admin Applications]
      summary: Create an application together with its initial OAuth client
      description: |
        The only creation path in Phase 2. The application and its initial
        client are provisioned atomically from the API consumer's view:
        local rows are committed first (`provisioning`), the provider call
        runs outside any database transaction, then provider identifiers and
        the one-time client secret are recorded. Provider failures return a
        safe 5xx; local metadata for a failed provisioning is never exposed
        as active. Standalone application creation without a client is not
        supported.
      operationId: createApplicationWithInitialClient
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationWithInitialClientRequest"
      responses:
        "201":
          description: |
            Application and initial client created. For confidential clients
            the `clientSecret` appears exactly once in this response
            (`Cache-Control: no-store`).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Cache-Control:
              description: Always `no-store` when a secret is included.
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationWithInitialClientResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/FieldValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/applications:
    get:
      tags: [Admin Applications]
      summary: List OAuth applications (cursor pagination)
      description: |
        Cursor-paginated, server-side filtered listing. Cursors are opaque
        HMAC-signed values bound to the current sort and filters; tampered
        cursors return 400. Only applications in a fully provisioned state
        are returned.
      operationId: listAdminApplications
      security:
        - SessionCookie: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a previous response.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size (1–100, default 20).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: query
          in: query
          required: false
          description: Server-side name/description search.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: |
            Sort key, `-` prefix for descending. Default `-updatedAt`.
            Stable ordering always appends the ID tie-breaker.
          schema:
            type: string
            enum: [updatedAt, -updatedAt, createdAt, -createdAt, name, -name]
            default: -updatedAt
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, disabled]
        - name: audience
          in: query
          required: false
          schema:
            type: string
            enum: [internal, external, hybrid]
        - name: ownerId
