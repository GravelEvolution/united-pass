          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                example: no-store
            Pragma:
              description: Always `no-cache`.
              schema:
                type: string
                example: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretRotationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/FieldValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ProviderUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: up_session
      description: |
        Browser session cookie (`up_session`) issued by United Pass. The cookie
        is HttpOnly, Secure and carries an explicit SameSite policy. The browser
        must not receive raw authentication-provider Refresh Tokens or
        long-lived tokens.

  headers:
    X-Request-ID:
      description: |
        The request ID used for log, error and audit correlation. The server
        accepts a valid upstream ID (alphanumeric, dash, underscore, colon;
        8-128 chars) or generates a cryptographically random `req_`-prefixed ID.
      schema:
        type: string
        pattern: "^[a-zA-Z0-9_:-]{8,128}$"
        example: req_0123456789abcdef0123456789abcdef

    Retry-After:
      description: |
        Seconds the client must wait before retrying a rate-limited request.
        Returned with `429` responses.
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 30

    Set-Session-Cookies:
      description: |
        Sets the browser session and CSRF cookies on successful authentication.
        Two cookies are issued:

          * `up_session` — HttpOnly, Secure, SameSite session cookie. Never
            contains a raw authentication-provider Refresh Token.
          * `up_csrf`   — CSRF token cookie readable by browser JavaScript,
            used to validate the `X-CSRF-Token` header on subsequent
            state-changing requests.

        Both cookies use restricted Path and explicit lifetime. Server-side
        revocation is supported.
      schema:
        type: string
        description: |
          A `Set-Cookie` header value. Two `Set-Cookie` headers are emitted,
          one for `up_session` and one for `up_csrf`.
        example: up_session=...; Path=/; HttpOnly; Secure; SameSite=Lax

    Clear-Session-Cookies:
      description: |
        Clears the browser session and CSRF cookies on logout. Both
        `up_session` and `up_csrf` are set with `Max-Age=0` so the browser
        discards them immediately.
      schema:
        type: string
        description: |
          A `Set-Cookie` header value with `Max-Age=0`. Two `Set-Cookie`
          headers are emitted, one for `up_session` and one for `up_csrf`.
        example: up_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax

  parameters:
    X-CSRF-Token:
      name: X-CSRF-Token
      in: header
      required: true
      description: |
        CSRF token that must match the value of the `up_csrf` cookie. Required
        on all browser-originated state-changing requests using cookie
        authentication. Safe HTTP methods must not mutate state.
      schema:
        type: string
        minLength: 1
        example: csrf_0123456789abcdef

    ApplicationIdPath:
      name: applicationId
      in: path
      required: true
      description: United Pass application ID (`app_…`).
      schema:
        type: string
        example: app_01HQFGXKN8H2C4JVMW7K3R4D8Z

    ClientIdPath:
      name: clientId
      in: path
      required: true
      description: |
        United Pass OAuth client ID (`clt_…`). The server asserts the client
        belongs to the path application; mismatch answers 404.
      schema:
        type: string
        example: clt_01HQFGXKN8H2C4JVMW7K3R4D8Z

    X-Reauthentication-Token:
      name: X-Reauthentication-Token
      in: header
      required: true
      description: |
        Single-use reauthentication grant issued by the reauthentication
        endpoints. Bound to the exact action and target resource; consumed
        atomically before the operation executes.
      schema:
        type: string
        minLength: 1
        example: reauth_grant_opaque_token

  responses:
    BadRequest:
      description: Malformed request, unknown JSON field, or invalid cursor.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid session.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Session is valid but the operation is not authorized.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: |
        Resource does not exist or is not accessible by the caller. Used
        consistently for inaccessible resources (anti-enumeration).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: State conflict (duplicate name, stale version, concurrent mutation).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    FieldValidationFailed:
      description: Domain validation failed; field-level errors are returned.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server failure. No internal detail is leaked.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProviderUnavailable:
      description: |
        The identity provider rejected or failed the provisioning call. The
        response carries a stable internal error class only — never raw
        provider errors.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, "not ready"]
          description: Liveness or readiness status

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code
          examples:
            internal: internal.unexpected
            validation: validation.failed
            reauth: session.reauthentication_required
        message:
          type: string
          description: Safe, user-displayable message
          example: "服务暂时无法处理该请求。"
        requestId:
          type: string
          description: Request ID for troubleshooting and audit correlation
          example: req_0123456789abcdef
        fieldErrors:
          type: array
          description: Field-level validation errors (array format)
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: The field that failed validation
          example: redirectUris[0]
        message:
          type: string
          description: Safe, user-displayable field error message
          example: "该重定向地址未登记。"

    LoginRequest:
      type: object
      description: |
        Credentials used to establish a browser session. `identifier` accepts
        either an account name or an email address. Authentication failures
        return generic errors that do not reveal which value was incorrect.
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier:
          type: string
          minLength: 1
          description: Account name or email address used to identify the user.
          example: zhixing.lin
        password:
          type: string
          minLength: 1
          format: password
          description: User-entered password. Never logged or persisted in plaintext.
          writeOnly: true
        remember:
          type: boolean
          default: false
          description: |
            When true, the session cookie is issued with an extended lifetime
            suitable for a "remember me" experience. When false or omitted, the
            session uses the default browser-session lifetime.
        resumeRequestId:
          type: string
          description: |
            Opaque server-issued authorization transaction ID to resume after
            successful login. When present and valid, login redirects to the
            authorization resume flow instead of the default account or admin
            destination. Only an opaque server-issued ID is accepted — never a
            raw return URL.
          pattern: "^[a-zA-Z0-9_:-]{8,128}$"
          example: req_01ABCdefGHIjkl

    MFARequiredResponse:
      type: object
      description: |
        Returned when the account requires multi-factor authentication before a
        session can be established. The `mfaToken` is an opaque, randomly
        generated United Pass token — it never contains provider credentials —
        and must be submitted to `POST /api/v1/auth/sessions/mfa`.
      required: [status, mfaToken, availableMethods, expiresAt]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [mfa_required]
          description: Indicates that MFA is required to continue.
        mfaToken:
          type: string
          minLength: 1
          description: |
            Opaque, short-lived token used to complete the MFA challenge. It is
            generated server-side and never embeds provider session credentials.
          example: opaque_mfa_token
        availableMethods:
          type: array
          description: MFA methods the user may use to complete the challenge.
          items:
            type: string
            enum: [totp, passkey, recovery_code]
          example: [totp, passkey, recovery_code]
        passkeyRequestOptions:
          type: object
          description: |
            WebAuthn PublicKeyCredentialRequestOptions returned when `passkey`
            is among the available methods. The browser must pass it to
            `navigator.credentials.get()` and submit the resulting assertion
            as `passkeyAssertion` to the MFA endpoint.
          example:
            publicKey:
              challenge: "abc123"
              rpId: login.example.com
              timeout: 60000
        expiresAt:
          type: string
          format: date-time
          description: |
            ISO 8601 UTC timestamp after which the `mfaToken` is no longer
            accepted.
          example: "2026-08-05T12:05:30Z"

    MFAChallengeRequest:
      type: object
      description: |
        Submission of an MFA verification code or assertion to complete a
        challenge started by `POST /api/v1/auth/sessions`. The payload depends
        on `method`: `totp` requires `code`; `passkey` requires
        `passkeyAssertion`; `recovery_code` is not supported in Phase 1.2.
      required: [mfaToken, method]
      additionalProperties: false
      properties:
        mfaToken:
          type: string
          minLength: 1
          description: Opaque MFA token returned in the login `202` response.
          example: opaque_mfa_token
        method:
          type: string
          enum: [totp, passkey, recovery_code]
          description: The MFA method being used to satisfy the challenge.
          example: totp
        code:
          type: string
          minLength: 1
          description: |
            User-entered verification value. Required for `totp` (a 6-digit
            code). Never logged.
          writeOnly: true
          example: "123456"
        passkeyAssertion:
          type: object
          description: |
            The WebAuthn assertion returned by `navigator.credentials.get()`,
            submitted verbatim. Required for `passkey`. Never logged.
          writeOnly: true
          example:
            id: assertion-id
            rawId: "base64"
            response:
              authenticatorData: "base64"
              signature: "base64"
              clientDataJSON: "base64"

    UserPersona:
      type: string
      enum: [consumer, employee]
      description: |
        A persona attached to a stable United Pass user. An external user who
        becomes an employee keeps the same `userId` and retains the consumer
        persona.

    EmployeeProfile:
      type: object
      description: |
        Active employee profile linked to the stable user identity. Optional —
        present only when the user has an active employee persona.
      required: [employeeId, departmentName, title]
      additionalProperties: false
      properties:
        employeeId:
          type: string
          description: Employee number unique within its scope.
          example: EMP-10032
        departmentName:
          type: string
          description: Display name of the employee's department.
          example: 平台架构部
        title:
          type: string
          description: Employee position or title.
          example: 高级工程师

    CurrentUser:
      type: object
      description: |
        Profile of the authenticated user. The `userId` is the stable United
        Pass identity primary key — not an email, phone number or external
        Provider identifier. `employeeProfile` is present only when the user
        has an active employee persona.
      required: [userId, displayName, email, phoneMasked, personas]
      additionalProperties: false
      properties:
        userId:
          type: string
          description: Stable United Pass user ID, used as the OIDC subject.
          example: usr_01HQFGXKN8H2C4JVMW7K3R4D8Z
        displayName:
          type: string
          description: User-facing display name.
          example: 林知行
        nickname:
          type: string
          nullable: true
          description: Optional user-chosen nickname.
          example: 知行
        avatarUrl:
          type: string
          format: uri
          nullable: true
          description: |
            Same-origin or controlled media domain URL of the user's avatar.
            Stored after server-side validation, re-encoding and metadata
            stripping. The frontend never submits an external image URL.
          example: https://cdn.example.com/avatars/usr_01HQFGXKN8H2C4JVMW7K3R4D8Z.webp
        email:
          type: string
          format: email
          description: Verified or primary email address.
          example: zhixing.lin@example.com
        phoneMasked:
          type: string
          description: Masked phone number safe for user display.
          example: "+86 138****0123"
        personas:
          type: array
          description: Personas attached to the user identity.
          items:
            $ref: "#/components/schemas/UserPersona"
          example: [consumer, employee]
        employeeProfile:
          allOf:
            - $ref: "#/components/schemas/EmployeeProfile"
          nullable: true
          description: Active employee profile, present only for employees.

    PermissionCapabilities:
      type: object
      description: |
        User-experience permission summary computed from authoritative backend
        attributes and Cerbos decisions. These capabilities drive frontend
        navigation visibility and control availability only. Every protected
        backend operation must independently authorize via Cerbos; frontend
        checks are not security controls.
      required:
        - userRead
        - userDisable
        - employeeManage
        - employeeOffboard
        - departmentManage
        - applicationRead
        - applicationManage
        - applicationSecretRotate
        - policyRead
        - policyManage
        - policyPublish
        - auditRead
        - auditExport
        - providerRead
        - providerManage
      additionalProperties: false
      properties:
        userRead:
          type: boolean
          description: May read managed user listings and user detail.
        userDisable:
          type: boolean
          description: May disable or enable users and revoke their sessions.
        employeeManage:
          type: boolean
          description: May create, link and update employee profiles.
        employeeOffboard:
          type: boolean
          description: May start employee offboarding and revoke access.
        departmentManage:
          type: boolean
          description: May create, update and delete departments.
        applicationRead:
          type: boolean
          description: May read OAuth application and client metadata.
        applicationManage:
          type: boolean
          description: May create, update and delete applications and clients.
        applicationSecretRotate:
          type: boolean
          description: May rotate confidential client secrets.
        policyRead:
          type: boolean
          description: May read authorization policies and versions.
        policyManage:
          type: boolean
          description: May create and update policy drafts.
        policyPublish:
          type: boolean
          description: May publish a policy version.
        auditRead:
          type: boolean
          description: May query and filter audit events.
        auditExport:
          type: boolean
          description: May create and download audit export jobs.
        providerRead:
          type: boolean
          description: May read identity provider metadata.
        providerManage:
          type: boolean
          description: May create, update, enable and disable identity providers.

    ScopeCatalogItem:
      type: object
      description: One entry of the backend-authoritative OAuth scope catalog.
      required: [scope, label, description, required]
      additionalProperties: false
      properties:
        scope:
          type: string
          example: reporting:read
        label:
          type: string
          example: 报表读取
        description:
          type: string
          example: 允许读取报表数据
        required:
          type: boolean
          description: Whether the scope is mandatory for the client profile.

    ReauthenticationRequest:
      type: object
      description: |
        Declares the high-risk action being prepared and verifies the current
        session user's password. Target resource IDs must match the eventual
        operation; the grant is bound to them.
      required: [action, password]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [application.delete, client.delete, client.secret.rotate]
          description: The high-risk action the grant will authorize.
        applicationId:
          type: string
          description: Target application (required for all current actions).
        clientId:
          type: string
          description: Target client (required for client actions).
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
          description: Current session user's password. Never logged.

    ReauthenticationGrantResponse:
      type: object
      required: [status, reauthToken, expiresAt]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [granted]
        reauthToken:
          type: string
          description: |
            Single-use grant token submitted as `X-Reauthentication-Token`.
            Consumed atomically by the target operation.
        expiresAt:
          type: string
          format: date-time

    ReauthenticationChallengeResponse:
      type: object
      description: Returned with 202 when a second factor must complete verification.
      required: [status, reauthToken, availableMethods, expiresAt]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [mfa_required]
        reauthToken:
          type: string
          description: Opaque challenge token for `POST /api/v1/auth/reauthentication/mfa`.
        availableMethods:
          type: array
          items:
            type: string
            enum: [totp, passkey]
        passkeyRequestOptions:
          type: object
          description: WebAuthn request options when `passkey` is available.
        expiresAt:
          type: string
          format: date-time

    ReauthenticationMfaRequest:
      type: object
      required: [reauthToken, method]
      additionalProperties: false
      properties:
        reauthToken:
          type: string
          minLength: 1
          description: Challenge token from the `202` response.
        method:
          type: string
          enum: [totp, passkey]
        code:
          type: string
          minLength: 1
          writeOnly: true
          description: TOTP code; required for `totp`. Never logged.
        passkeyAssertion:
          type: object
          writeOnly: true
          description: WebAuthn assertion; required for `passkey`. Never logged.

    RedirectUriEntry:
      type: object
      required: [uri, isLoopback, addedAt]
      additionalProperties: false
      properties:
        uri:
          type: string
          description: Registered URI, stored exactly as submitted (no normalization).
        isLoopback:
          type: boolean
          description: True for the RFC 8252 loopback HTTP exception.
        addedAt:
          type: string
          format: date-time

    ClientSecretRecord:
      type: object
      description: Secret metadata only — never a secret value.
      required: [secretId, label, createdAt]
      additionalProperties: false
      properties:
        secretId:
          type: string
          example: sec_01HQFGXKN8H2C4JVMW7K3R4D8Z
        label:
          type: string
          example: 初始 Secret
        createdAt:
          type: string
          format: date-time
        lastRotatedAt:
          type: string
          format: date-time
          nullable: true

    ApplicationGrantSummary:
      type: object
      description: User grant summary. Always an empty array until Phase 3.
      required: [grantId, userLabel, scopes, grantedAt, status]
      additionalProperties: false
      properties:
        grantId:
          type: string
        userLabel:
          type: string
        scopes:
          type: array
          items:
            type: string
        grantedAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, revoked]

    ApplicationAuditEntry:
      type: object
      description: Security event actually recorded for the application (no fake data).
      required: [eventId, eventType, actorName, occurredAt, result]
      additionalProperties: false
      properties:
        eventId:
          type: string
        eventType:
          type: string
          example: oauth_client.secret_rotated
        actorName:
          type: string
        occurredAt:
          type: string
          format: date-time
        result:
          type: string
          enum: [success, denied]

    OAuthApplication:
      type: object
      description: Application list item.
      required:
        [applicationId, name, audience, ownerId, ownerName, status, clientCount, updatedAt]
      additionalProperties: false
      properties:
        applicationId:
          type: string
          example: app_01HQFGXKN8H2C4JVMW7K3R4D8Z
        name:
          type: string
        audience:
          type: string
          enum: [internal, external, hybrid]
        ownerId:
          type: string
          description: Stable owner user ID (authoritative; G1 fix).
        ownerName:
          type: string
          description: Derived display name of the owner; never authoritative.
        status:
          type: string
          enum: [active, disabled]
        clientCount:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time

    ApplicationListResponse:
      type: object
      required: [items, page]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OAuthApplication"
        page:
          type: object
          required: [nextCursor, hasMore]
          additionalProperties: false
          properties:
            nextCursor:
              type: string
              nullable: true
              description: Opaque HMAC-signed cursor; null when no more pages.
            hasMore:
              type: boolean

    OAuthClient:
      type: object
      description: OAuth client detail. Secret values are never included.
      required:
        [clientId, applicationId, name, clientType, grantTypes,
         tokenEndpointAuthMethod, redirectUris, allowedScopes, consentMode,
         status, clientSecrets, createdAt, updatedAt]
      additionalProperties: false
      properties:
        clientId:
          type: string
          example: clt_01HQFGXKN8H2C4JVMW7K3R4D8Z
        applicationId:
          type: string
        name:
          type: string
        clientType:
          type: string
          enum: [public, confidential]
        grantTypes:
          type: array
          items:
            type: string
            enum: [authorization_code, refresh_token, client_credentials]
        tokenEndpointAuthMethod:
          type: string
          enum: [client_secret_basic, none]
          description: |
            Only values with verified provider support and a reviewed security
            model are exposed in Phase 2 (`client_secret_post` and
            `private_key_jwt` are rejected with 422).
        redirectUris:
          type: array
          items:
            $ref: "#/components/schemas/RedirectUriEntry"
        logoutUri:
          type: string
          nullable: true
        allowedScopes:
          type: array
          items:
            $ref: "#/components/schemas/ScopeCatalogItem"
        consentMode:
          type: string
          enum: [always, first_authorization]
          description: |
            For `server_to_server` clients only `always` is accepted and it is
            recorded as not-applicable metadata.
        status:
          type: string
          enum: [active, disabled]
        clientSecrets:
          type: array
          description: Secret metadata; empty for public clients.
          items:
            $ref: "#/components/schemas/ClientSecretRecord"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OAuthApplicationDetail:
      type: object
      required:
        [applicationId, name, description, audience, ownerId, ownerName,
         status, clients, grants, auditEntries, createdAt, updatedAt]
      additionalProperties: false
      properties:
        applicationId:
          type: string
        name:
          type: string
        description:
          type: string
        logoUrl:
          type: string
          format: uri
          nullable: true
        audience:
          type: string
          enum: [internal, external, hybrid]
        ownerId:
          type: string
        ownerName:
          type: string
        status:
          type: string
          enum: [active, disabled]
        clients:
          type: array
          items:
            $ref: "#/components/schemas/OAuthClient"
        grants:
          type: array
          description: Real grants only; always empty until Phase 3.
          items:
            $ref: "#/components/schemas/ApplicationGrantSummary"
        auditEntries:
          type: array
          description: Only security events actually recorded.
          items:
            $ref: "#/components/schemas/ApplicationAuditEntry"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApplicationCreateInput:
      type: object
      required: [name, audience, ownerId]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
          maxLength: 500
          default: ""
        audience:
          type: string
          enum: [internal, external, hybrid]
        ownerId:
          type: string
          description: |
            Stable United Pass user ID of the owner. Must exist; ownership is
            never resolved from a display name (G1 fix).

    OAuthClientCreateRequest:
      type: object
      required: [name, profile, redirectUris, allowedScopes, consentMode]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 64
        profile:
          type: string
          enum: [web_server, spa_mobile, server_to_server]
          description: |
            `server_to_server` is kept in the enum for forward compatibility
            but is rejected with a 422 `profile` field error: ZITADEL v2.71
            serves client_credentials tokens only for machine users, so a
            provisioned OIDC app could never execute the grant.
        redirectUris:
          type: array
          maxItems: 20
          description: |
            Exact strings; https or loopback http only; no fragments,
            userinfo, wildcards or normalization. Required for interactive
            profiles, forbidden for `server_to_server`.
          items:
            type: string
            maxLength: 2048
        logoutUri:
          type: string
          maxLength: 2048
          default: ""
          description: Same security checks as redirect URIs.
        allowedScopes:
          type: array
          description: Registered scope IDs only; duplicates rejected.
          items:
            type: string
        consentMode:
          type: string
          enum: [always, first_authorization]

    ApplicationWithInitialClientRequest:
      type: object
      required: [application, initialClient]
      additionalProperties: false
      properties:
        application:
          $ref: "#/components/schemas/ApplicationCreateInput"
        initialClient:
          $ref: "#/components/schemas/OAuthClientCreateRequest"

    ApplicationWithInitialClientResponse:
      type: object
      required: [applicationId, clientId]
      additionalProperties: false
      properties:
        applicationId:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
          writeOnly: true
          description: |
            Present exactly once for confidential clients; absent for public
            clients. Never persisted, never queryable afterwards.

    OAuthClientCreationResponse:
      type: object
      required: [clientId]
      additionalProperties: false
      properties:
        clientId:
          type: string
        clientSecret:
          type: string
          writeOnly: true
          description: Present exactly once for confidential clients.

    ApplicationUpdateRequest:
      type: object
      description: Partial update; at least one field required.
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
          maxLength: 500
        audience:
          type: string
          enum: [internal, external, hybrid]
        ownerId:
          type: string
          description: New owner user ID; must exist.

    OAuthClientUpdateRequest:
      type: object
      description: |
        Partial update; at least one field required. Profile is immutable.
        When `redirectUris` is present it replaces the full set.
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 64
        redirectUris:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 2048
        logoutUri:
          type: string
          maxLength: 2048
          nullable: true
        allowedScopes:
          type: array
          items:
            type: string
        consentMode:
          type: string
          enum: [always, first_authorization]

    SecretRotationResponse:
      type: object
      required: [secretId, clientSecret, previousSecretExpiresAt]
      additionalProperties: false
      properties:
        secretId:
          type: string
          description: United Pass secret ID for the new secret.
        clientSecret:
          type: string
          writeOnly: true
          description: The new secret, shown exactly once. Never persisted.
        previousSecretExpiresAt:
          type: string
          format: date-time
          description: |
            Expiry of the previous secret. Against ZITADEL v2.71 this equals
            the rotation timestamp (zero grace period).
