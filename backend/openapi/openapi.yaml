        the server, requires an exact provider/tenant/subject identity link,
        and creates a local session. Email, phone and name never authenticate
        or merge an identity.
      operationId: completeFeishuLogin
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: code
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 2048
      responses:
        "303":
          description: Redirect to account/consent continuation or a generic login error.
          headers:
            Location:
              schema:
                type: string
