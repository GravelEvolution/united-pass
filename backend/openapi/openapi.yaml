openapi: 3.1.0

info:
  title: United Pass Backend API
  description: |
    United Pass is a unified identity, account, organization, OAuth application,
    authorization, Provider synchronization and audit platform.

    This OpenAPI specification is the machine-readable contract. The human-readable
    detail lives in `frontend/docs/api-contracts.md`. Both must stay synchronized.

    Phase 0 scope: operational endpoints only.
    Phase 1 scope: session establishment, MFA, logout, current user and
    permission capabilities.
    Phase 2 scope: OAuth application and client management plane (scope
    catalog, application/client lifecycle, secret rotation, reauthentication).
    Phase 5 scope: stable user administration, optional employee profiles,
    departments, offboarding and durable access-revocation convergence.
    Phase 6 scope: Feishu federated login, durable directory staging,
    synchronization history and explicit identity-link conflict resolution.
    Phase 7 scope: Cerbos-backed ABAC policy drafts/version publication and
    durable audit search/export jobs.
    Phase 8 scope: controlled legal-document publication, requester-owned
    personal-data exports and cancellable delayed account deletion.
    DreamUP administration scope: event-scoped roles, administrator step-up,
    admission review and restricted identity-access approvals.
    See `../docs/adr-0004.md`, `../docs/adr-0011.md` and
    `../docs/adr-0012.md` and `../docs/adr-0013.md` for the architecture decisions.

    Business API paths use the full `/api/v1/...` prefix explicitly rather than
    relying on a global server base path, so that root-level operational endpoints
    and versioned API endpoints can coexist accurately.
  version: 0.10.0
  contact:
    name: United Pass backend team

servers:
  - url: http://localhost:8080
    description: Local development
  - url: /
    description: Same-origin production

tags:
  - name: Operational
    description: Health and readiness endpoints
  - name: Session
    description: |
      Browser session establishment, MFA challenge completion and logout.
      Sessions are carried by the `up_session` HttpOnly cookie; state-changing
      operations require the `X-CSRF-Token` header matching the `up_csrf` cookie.
  - name: WeChat Mini Program
    description: |
      Default-off server-side verification of one-time Mini Program codes.
      The client never sends an openId, unionId, session_key, AppSecret or a
      claimed phone number. Legacy login restores only a pre-existing explicit
      binding; the separately gated onboarding routes can create or link an
      account after password/MFA and email controls.
  - name: Registration
    description: |
      Default-off public account creation and email verification. Every
      mutation requires an exact same-origin `Origin` header, JSON, a bounded
      body, and an independent Redis rate-limit namespace.
  - name: Account
    description: Current user profile and permission capabilities
  - name: Account Security
    description: Provider-authoritative account factors and passkey lifecycle
  - name: Privacy and Legal
    description: Personal-data rights and controlled public legal-document status
  - name: Reauthentication
    description: |
      High-risk operation reauthentication. A completed grant is required
      (single-use, action-bound, session-bound) before delete or secret
      rotation operations execute.
  - name: Administrator Step-up
    description: |
      Owner-only DreamUP administrator question-and-answer step-up. The entire
      namespace is absent unless the server-side DreamUP administration gate is
      explicitly enabled. Challenge secrets are never returned by mutations.
  - name: Restricted Identity Access
    description: |
      Event-scoped, time-limited access to an allowlisted set of identity fields.
      Requests never include legal documents and responses never expose the
      encrypted reason, internal authorization stamp, or one-time claim nonce.
  - name: Admin Users
    description: Stable identity administration and target user session lifecycle
  - name: Admin Employees
    description: Employee profiles linked explicitly to stable user identities
  - name: Admin Departments
    description: Cycle-safe organization hierarchy and membership views
  - name: Provider Login
    description: Feishu OAuth login initiation and callback; provider credentials remain server-only
  - name: Admin Identity Providers
    description: Provider status, durable directory synchronization and explicit identity linking
  - name: Admin Policies
    description: Versioned ABAC drafts, simulation and Cerbos publication
  - name: Admin Audit
    description: Durable security-event filtering and short-lived asynchronous CSV exports
  - name: Admin Registration Defense
    description: Audited system-administrator recovery for false-positive registration blocks
  - name: Scope Catalog
    description: Backend-authoritative OAuth scope catalog
  - name: Admin Applications
    description: |
      OAuth application management plane. All mutating operations require
      session + CSRF + server-side authorization; deleting an application
      additionally requires a reauthentication grant. Provider identifiers
      never appear in responses.
  - name: Admin OAuth Clients
    description: |
      OAuth client management nested under its owning application. Every
      nested route asserts `client.applicationId == path.applicationId`
      (404 on mismatch, anti-enumeration). Secret rotation requires the
      `application.secret.rotate` permission plus a reauthentication grant;
      the new secret is returned exactly once with `Cache-Control: no-store`.

paths:
  /.well-known/dreamup-admin-jwks.json:
    get:
      tags: [Administrator Step-up]
      summary: DreamUP delegation verification keys
      operationId: getDreamUPAdminJWKS
      responses:
        "200":
          description: Public Ed25519 JWK set
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { type: object }
    head:
      tags: [Administrator Step-up]
      summary: Check DreamUP administrator delegation verification keys
      operationId: headDreamUPAdminJWKS
      responses:
        "200":
          description: Verification-key representation metadata without a response body

  /.well-known/dreamup-mobile-jwks.json:
    get:
      tags: [WeChat Mini Program]
      summary: DreamUP participant delegation verification keys
      operationId: getDreamUPMobileJWKS
      responses:
        "200":
          description: Public Ed25519 JWK set for request-bound Mini Program assertions
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { type: object }
    head:
      tags: [WeChat Mini Program]
      summary: Check DreamUP participant delegation verification keys
      operationId: headDreamUPMobileJWKS
      responses:
        "200":
          description: Verification-key representation metadata without a response body

  /api/v1/admin/dreamup/events:
    get:
      tags: [Administrator Step-up]
      summary: List authorized DreamUP events
      description: Returns only active event bindings authorized for dashboard access. The capability array is a fail-closed, policy-evaluated UI snapshot; every subsequent BFF request is authorized again against its exact resource.
      operationId: listAuthorizedDreamUPEvents
      security: [{ SessionCookie: [] }, { MiniProgramBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/X-MiniProgram-Client-When-Bearer"
      responses:
        "200":
          description: Authorized event summaries
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DreamUPAdminEventsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/dreamup/session:
    get:
      tags: [Administrator Step-up]
      summary: Bootstrap the first-party DreamUP administrator session
      operationId: getDreamUPAdminBrowserSession
      security: [{ SessionCookie: [] }, { MiniProgramBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/X-MiniProgram-Client-When-Bearer"
      responses:
        "200":
          description: Authenticated user; browser-cookie callers also receive their CSRF value in the body.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DreamUPAdminSessionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/dreamup/eligibility:
    get:
      tags: [Administrator Step-up]
      summary: Check whether the current account may enter DreamUP administration
      operationId: getDreamUPAdminEligibility
      description: |
        Low-disclosure authenticated bootstrap check. Returns true only when the
        caller has at least one active event binding authorized for
        `event.dashboard.read`. Generic account personas are not authority. This
        operation deliberately returns no event, role, count or step-up data and
        does not require administrator step-up.
      security: [{ SessionCookie: [] }, { MiniProgramBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/X-MiniProgram-Client-When-Bearer"
      responses:
        "200":
          description: Eligibility result containing one boolean only.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DreamUPAdminEligibilityResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/dreamup/reauthentication:
    post:
      tags: [Administrator Step-up]
      summary: Mint a one-shot DreamUP administrator grant from a fresh WeChat proof
      operationId: reauthenticateDreamUPNativeAdministrator
      description: |
        Native Mini Program only. Exchanges a fresh, one-use `wx.login` code,
        verifies that it belongs to the same user as the current native bearer,
        and revalidates the current event role, binding version and account
        security epoch. Success returns a short-lived grant bound to exactly one
        high-risk action and canonical target. The grant is consumed atomically
        by the matching administrator request and is never persisted by the
        Mini Program.
      security: [{ MiniProgramBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/X-MiniProgram-Client"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DreamUPNativeReauthenticationRequest" }
      responses:
        "200":
          description: Fresh action-and-target-bound single-use grant issued.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReauthenticationGrantResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/FieldValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/admin/dreamup/step-up/challenge:
    get:
      tags: [Administrator Step-up]
      summary: Read the DreamUP administrator step-up challenge
      operationId: getDreamUPAdminStepUpChallenge
      description: Browser-cookie compatibility endpoint only. Native Mini Program callers must use the fresh `wx.login` `/api/v1/admin/dreamup/reauthentication` flow and are rejected before this handler.
      security: [{ SessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/DreamUPEventIdQuery"
      responses:
        "200":
          description: Current administrator step-up state and public question.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStepUpChallengeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/dreamup/step-up/enroll:
    post:
      tags: [Administrator Step-up]
      summary: Enroll the DreamUP administrator step-up answer
      operationId: enrollDreamUPAdminStepUp
      description: Browser-cookie compatibility endpoint only; native Mini Program bearer callers are rejected and use fresh wx.login reauthentication instead. Cookie callers provide CSRF. A fresh provider-backed primary login is always required. Existing TOTP, passkey, or recovery MFA is accepted; only an active system-scoped super_admin or top_admin with no existing challenge may use the initial-enrollment bootstrap exception without existing MFA. A federated session lacking provider session proof receives session.reauthentication_required.
      security: [{ SessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminStepUpEnrollRequest" }
      responses:
        "201":
          description: Step-up answer enrolled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStepUpMutationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/dreamup/step-up/verify:
    post:
      tags: [Administrator Step-up]
      summary: Verify the DreamUP administrator step-up answer
      operationId: verifyDreamUPAdminStepUp
      description: |
        Browser cookie compatibility endpoint only. Native Mini Program bearer
        callers are rejected and must use the fresh `wx.login`
        `/api/v1/admin/dreamup/reauthentication` flow. The provider-backed
        primary login must be no older than 30 minutes. Every mutation,
        including application review and check-in scan, is high risk.
        Verification refreshes the durable session-bound proof used by the
        existing cookie website; that website may omit the header only while
        this proof is no more than five minutes old. A cookie request that
        supplies a token gets strict single-use semantics and cannot fall back
        after token rejection.
      security: [{ SessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminStepUpVerifyRequest" }
      responses:
        "200":
          description: Step-up grant established for the current session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStepUpMutationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "423": { $ref: "#/components/responses/Locked" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/admin/dreamup/events/{eventId}/operations/status:
    parameters:
      - $ref: "#/components/parameters/DreamUPEventIdPath"
      - $ref: "#/components/parameters/X-MiniProgram-Client-When-Bearer"
    get:
      tags: [Administrator Step-up]
      summary: Read the durable outcome of a DreamUP administration mutation
      operationId: getDreamUPAdminMutationStatus
      description: |
        Returns only the authoritative United Pass mutation-ledger status from
        the dedicated operational store for the supplied idempotency key. The
        ledger is physically separate from the authority database. Access
        requires the initiating account, a current event dashboard binding,
        and active administrator step-up.
        This endpoint never reissues the mutation and never returns the private
        DreamUP receipt hash or the original request/response body. After a
        succeeded result, refetch the authoritative DreamUP resource state.
      security: [{ SessionCookie: [] }, { MiniProgramBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
      responses:
        "200":
          description: Durable mutation outcome metadata.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DreamUPMutationStatusResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/FieldValidationFailed" }
        "502":
          description: The durable outcome ledger is temporarily unavailable or internally inconsistent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/dreamup/events/{eventId}/teams:
    parameters:
      - $ref: "#/components/parameters/DreamUPEventIdPath"
      - $ref: "#/components/parameters/X-MiniProgram-Client-When-Bearer"
    get:
      tags: [Administrator Step-up]
      summary: List review-safe DreamUP team summaries
      operationId: listDreamUPAdminTeams
      description: Requires the event dashboard-read capability and an active administrator session. Participant contact details and application answers are not disclosed.
      security: [{ SessionCookie: [] }, { MiniProgramBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/DreamUPAdminLimitQuery"
        - $ref: "#/components/parameters/DreamUPAdminCursorQuery"
      responses:
        "200":
          description: Review-safe team summaries for the selected event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DreamUPAdminTeamPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/dreamup/events/{eventId}/inspection-points:
    parameters:
      - $ref: "#/components/parameters/DreamUPEventIdPath"
      - $ref: "#/components/parameters/X-MiniProgram-Client-When-Bearer"
    get:
      tags: [DreamUP Operations]
      summary: List DreamUP inspection points
      operationId: listDreamUPInspectionPoints
      description: Requires `event.inspection.point.read`. The route is unavailable until isolated feature schema v2 is ready.
      security: [{ SessionCookie: [] }, { MiniProgramBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/DreamUPAdminLimitQuery"
        - $ref: "#/components/parameters/DreamUPAdminCursorQuery"
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive, archived] }
      responses:
        "200":
          description: Stable inspection-point page.
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/DreamUPInspectionPointPage" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/FieldValidationFailed" }
        "502": { $ref: "#/components/responses/ProviderUnavailable" }
    post:
      tags: [DreamUP Operations]
      summary: Create a DreamUP inspection point
      operationId: createDreamUPInspectionPoint
      description: Requires `event.inspection.point.manage` and a fresh action/target-bound proof.
      security: [{ SessionCookie: [] }, { MiniProgramBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/DreamUP-X-Reauthentication-Token"
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/DreamUP-If-Match"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DreamUPInspectionPointCreateRequest" } } }
      responses:
        "200":
          description: Idempotent replay of the original create result.
          content: { application/json: { schema: { $ref: "#/components/schemas/DreamUPInspectionPointMutationResponse" } } }
        "201":
          description: Created point and optional one-time entity code.
          headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { schema: { type: string, const: no-store } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/DreamUPInspectionPointMutationResponse" } } }
        "401": { $ref: "#/components/responses/DreamUPAdminUnauthorizedOrStepUp" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/FieldValidationFailed" }
        "502": { $ref: "#/components/responses/ProviderUnavailable" }

  /api/v1/admin/dreamup/events/{eventId}/inspection-point-image-upload-intents:
    parameters:
      - $ref: "#/components/parameters/DreamUPEventIdPath"
      - $ref: "#/components/parameters/X-MiniProgram-Client-When-Bearer"
    post:
      tags: [DreamUP Operations]
      summary: Create a private inspection-point image upload intent
      operationId: createDreamUPInspectionPointImageUploadIntent
      security: [{ SessionCookie: [] }, { MiniProgramBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/DreamUP-X-Reauthentication-Token"
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/DreamUP-If-Match"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DreamUPAdminImageUploadIntentRequest" } } }
      responses:
        "200": { description: Idempotent replay., content: { application/json: { schema: { $ref: "#/components/schemas/DreamUPAdminImageUploadIntent" } } } }
        "201": { description: Signed, short-lived private upload intent., content: { application/json: { schema: { $ref: "#/components/schemas/DreamUPAdminImageUploadIntent" } } } }
        "401": { $ref: "#/components/responses/DreamUPAdminUnauthorizedOrStepUp" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/FieldValidationFailed" }
        "502": { $ref: "#/components/responses/ProviderUnavailable" }

  /api/v1/admin/dreamup/events/{eventId}/inspection-points/{pointId}:
    parameters:
      - $ref: "#/components/parameters/DreamUPEventIdPath"
      - $ref: "#/components/parameters/X-MiniProgram-Client-When-Bearer"
      - name: pointId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/DreamUPOpaqueOperationalId" }
    get:
      tags: [DreamUP Operations]
      summary: Read a DreamUP inspection point
      operationId: getDreamUPInspectionPoint
      security: [{ SessionCookie: [] }, { MiniProgramBearer: [] }]
      responses:
        "200": { description: Inspection point., content: { application/json: { schema: { $ref: "#/components/schemas/DreamUPInspectionPointItemResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/ProviderUnavailable" }
    patch:
      tags: [DreamUP Operations]
      summary: Update a DreamUP inspection point
      operationId: updateDreamUPInspectionPoint
      security: [{ SessionCookie: [] }, { MiniProgramBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/DreamUP-X-Reauthentication-Token"
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/DreamUP-If-Match"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DreamUPInspectionPointUpdateRequest" } } }
      responses:
        "200": { description: Updated point and optional one-time code., content: { application/json: { schema: { $ref: "#/components/schemas/DreamUPInspectionPointMutationResponse" } } } }
        "401": { $ref: "#/components/responses/DreamUPAdminUnauthorizedOrStepUp" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/FieldValidationFailed" }
        "502": { $ref: "#/components/responses/ProviderUnavailable" }

  /api/v1/admin/dreamup/events/{eventId}/inspection-points/{pointId}/code-rotations:
    parameters:
      - $ref: "#/components/parameters/DreamUPEventIdPath"
      - $ref: "#/components/parameters/X-MiniProgram-Client-When-Bearer"
      - name: pointId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/DreamUPOpaqueOperationalId" }
    post:
      tags: [DreamUP Operations]
      summary: Rotate an inspection-point QR code
      operationId: rotateDreamUPInspectionPointCode
      security: [{ SessionCookie: [] }, { MiniProgramBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/DreamUP-X-Reauthentication-Token"
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/DreamUP-If-Match"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DreamUPEmptyMutationRequest" } } }
      responses:
        "200": { description: Rotated code returned once., content: { application/json: { schema: { $ref: "#/components/schemas/DreamUPInspectionPointMutationResponse" } } } }
        "401": { $ref: "#/components/responses/DreamUPAdminUnauthorizedOrStepUp" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/FieldValidationFailed" }
        "502": { $ref: "#/components/responses/ProviderUnavailable" }

  /api/v1/admin/dreamup/events/{eventId}/inspection-points/{pointId}/inspections:
    parameters:
      - $ref: "#/components/parameters/DreamUPEventIdPath"
      - $ref: "#/components/parameters/X-MiniProgram-Client-When-Bearer"
      - name: pointId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/DreamUPOpaqueOperationalId" }
    post:
      tags: [DreamUP Operations]
      summary: Start an inspection with a fresh scan receipt
      operationId: startDreamUPInspection
      security: [{ SessionCookie: [] }, { MiniProgramBearer: [] }]
      parameters:
