          description: Normalized OS/device family; empty means unknown.
        clientName:
          type: string
          description: Normalized browser/client family; empty means unknown.
        approximateLocation:
          oneOf:
            - type: string
            - type: "null"
          description: Always null in P4; no GeoIP fact is fabricated.
        ipAddressMasked:
          type: string
          description: Masked address only; empty means unknown.
        lastActiveAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        authenticationMethods:
          type: array
          items:
            type: string
        isCurrent:
          type: boolean
          description: Computed by the backend from the authenticated principal.

    RevokedSessionCount:
      type: object
      required: [revoked]
      additionalProperties: false
      properties:
        revoked:
          type: integer
          minimum: 0

    PasskeySummary:
      type: object
      required: [passkeyId, createdAt, state]
      additionalProperties: false
      properties:
        passkeyId:
          type: string
          minLength: 1
        createdAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        state:
          type: string
          enum: [active, pending]

    PasskeyEnrollmentResponse:
      type: object
      required: [enrollmentToken, passkeyId, publicKeyCredentialCreationOptions]
      additionalProperties: false
      properties:
        enrollmentToken:
          type: string
          minLength: 1
        passkeyId:
          type: string
          minLength: 1
        publicKeyCredentialCreationOptions:
