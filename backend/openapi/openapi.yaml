          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: "#/components/schemas/DreamUPOpaqueOperationalId" }
        templateVersion: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$", default: label-v1 }

    DreamUPQRPrintJobItem:
      type: object
      required: [codeId, codeGeneration, entityType, entityId, label, secondaryLabel, location, qrToken]
      additionalProperties: false
      properties:
        codeId: { $ref: "#/components/schemas/DreamUPOpaqueOperationalId" }
        codeGeneration: { type: integer, minimum: 1 }
        entityType: { type: string, enum: [inspection_point, asset_unit, personal_asset_assignment] }
        entityId: { $ref: "#/components/schemas/DreamUPOpaqueOperationalId" }
        label: { type: string, minLength: 1, maxLength: 160 }
        secondaryLabel: { type: string, maxLength: 500 }
        location: { type: [string, "null"], maxLength: 500 }
        qrToken: { type: [string, "null"], pattern: "^[A-Za-z0-9_-]{43}$", readOnly: true }

    DreamUPQRPrintJob:
      type: object
      required: [id, printJobId, kind, purpose, authorizationCapability, templateVersion, itemCount, manifestSha256, status, artifactContentType, errorCode, expiresAt, version, createdAt, updatedAt, items]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/DreamUPOpaqueOperationalId" }
        printJobId: { $ref: "#/components/schemas/DreamUPOpaqueOperationalId" }
        kind: { type: string, enum: [inspection_point, event_asset, personal_asset] }
        purpose: { type: string, enum: [inspection_point, public_asset, personal_asset] }
        authorizationCapability: { type: string, enum: [event.qr.print.single, event.qr.print.bulk] }
        templateVersion: { type: string, minLength: 1, maxLength: 64 }
        itemCount: { type: integer, minimum: 1, maximum: 100 }
        manifestSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        status: { type: string, enum: [queued, ready, failed, expired] }
        artifactContentType: { type: [string, "null"], maxLength: 160 }
        errorCode: { type: [string, "null"], maxLength: 160 }
        expiresAt: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/DreamUPQRPrintJobItem" }

    DreamUPQRPrintJobResponse:
      type: object
      required: [item, replayed]
      additionalProperties: false
      properties:
        item: { $ref: "#/components/schemas/DreamUPQRPrintJob" }
        replayed: { type: boolean }
