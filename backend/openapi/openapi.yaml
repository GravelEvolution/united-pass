  /api/v1/auth/providers/feishu/authorize:
    get:
      tags: [Provider Login]
      summary: Begin Feishu OAuth login
      description: |
        Creates a random, hash-keyed, single-use OAuth state in Redis and
        redirects to Feishu. The optional resumeRequestId is an opaque local
        authorization-request ID, never an arbitrary return URL.
      operationId: beginFeishuLogin
      parameters:
        - name: resumeRequestId
          in: query
          required: false
          schema:
            type: string
            pattern: "^[A-Za-z0-9_:-]{1,256}$"
        - name: remember
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "302":
          description: Redirect to the configured Feishu authorization endpoint.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
