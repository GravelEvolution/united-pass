  /api/v1/admin/applications/{applicationId}/clients/{clientId}/secret-rotations:
    post:
      tags: [Admin OAuth Clients]
      summary: Rotate a confidential client secret
      description: |
        Requires `application.secret.rotate`, rate limiting, reauthentication
        and audit. Concurrency is single-winner; a failed rotation never
        revokes a still-valid old secret. The new secret is returned exactly
        once; against ZITADEL v2.71 the previous secret is invalidated
        immediately (no provider-side grace period — see ADR-0004 §6).
        Public clients cannot rotate (422).
      operationId: rotateAdminOAuthClientSecret
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ApplicationIdPath"
        - $ref: "#/components/parameters/ClientIdPath"
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/X-Reauthentication-Token"
      responses:
        "200":
          description: Secret rotated; the new secret appears only here.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                example: no-store
            Pragma:
              description: Always `no-cache`.
              schema:
                type: string
                example: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretRotationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
