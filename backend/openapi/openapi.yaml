  /api/v1/admin/applications/{applicationId}:
    get:
      tags: [Admin Applications]
      summary: Get application detail with clients, grants and audit entries
      description: |
        `grants` is a real array (always empty until Phase 3). `auditEntries`
        contains only security events actually recorded for this application.
        No fake data.
      operationId: getAdminApplication
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ApplicationIdPath"
