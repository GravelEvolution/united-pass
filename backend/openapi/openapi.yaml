      properties:
        status:
          type: string
          const: confirmed
        passkeyId:
          type: string
          minLength: 1

    RedirectUriEntry:
      type: object
      required: [uri, isLoopback, addedAt]
      additionalProperties: false
      properties:
        uri:
          type: string
          description: Registered URI, stored exactly as submitted (no normalization).
