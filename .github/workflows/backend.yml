name: Backend Quality Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, Vet, Test, Race and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: up_test
          POSTGRES_PASSWORD: up_test_pass
          POSTGRES_DB: up_test_db
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U up_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Vet (integration)
        run: go vet -tags integration ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Provision disposable integration services
        shell: bash
        run: |
          set -euo pipefail

          run_token="$(openssl rand -hex 6)"
          postgres_role="up_it_${run_token}"
          postgres_database="up_it_${run_token}"
          postgres_schema="up_it_schema_${run_token}"
          postgres_password="$(openssl rand -hex 24)"
          redis_password="$(openssl rand -hex 24)"
          redis_container="up-redis-it-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          postgres_container="${{ job.services.postgres.id }}"

          echo "::add-mask::${postgres_password}"
          echo "::add-mask::${redis_password}"

          if [ -z "${postgres_container}" ]; then
            echo "::error::PostgreSQL service container ID is unavailable"
            exit 1
          fi

          docker exec "${postgres_container}" \
            psql --username up_test --dbname up_test_db --set ON_ERROR_STOP=1 \
            --command "CREATE ROLE \"${postgres_role}\" LOGIN PASSWORD '${postgres_password}'"
          docker exec "${postgres_container}" \
            createdb --username up_test --owner "${postgres_role}" "${postgres_database}"
          docker exec "${postgres_container}" \
            psql --username up_test --dbname "${postgres_database}" --set ON_ERROR_STOP=1 \
            --command "CREATE SCHEMA \"${postgres_schema}\" AUTHORIZATION \"${postgres_role}\";"

          cleanup_failed_provision() {
            status=$?
            if [ "${status}" -ne 0 ]; then
              docker rm --force "${redis_container}" >/dev/null 2>&1 || true
            fi
            exit "${status}"
          }
          trap cleanup_failed_provision EXIT

          docker run --detach --rm \
            --name "${redis_container}" \
            --publish 127.0.0.1:16379:6379 \
            redis:7.4-alpine \
            redis-server --save "" --appendonly no --requirepass "${redis_password}" >/dev/null

          redis_ready=false
          for _ in $(seq 1 30); do
            if docker exec --env "REDISCLI_AUTH=${redis_password}" "${redis_container}" \
              redis-cli ping 2>/dev/null | grep --quiet '^PONG$'; then
              redis_ready=true
              break
            fi
            sleep 1
          done
          if [ "${redis_ready}" != true ]; then
            echo "::error::Disposable Redis did not become ready"
            exit 1
          fi

          {
            echo "UP_TEST_DISPOSABLE_RUN_TOKEN=${run_token}"
            echo "UP_TEST_DATABASE_URL=postgres://${postgres_role}:${postgres_password}@127.0.0.1:15433/${postgres_database}?sslmode=disable"
            echo "UP_TEST_DATABASE_SCHEMA=${postgres_schema}"
            echo "UP_TEST_REDIS_URL=redis://:${redis_password}@127.0.0.1:16379/15"
            echo "UP_TEST_REDIS_KEY_PREFIX=up:local-it:${run_token}:"
            echo "UP_TEST_REDIS_CONTAINER=${redis_container}"
          } >> "${GITHUB_ENV}"

          trap - EXIT

      - name: Integration tests
        run: go test -tags integration -race ./internal/adapters/postgres/... ./internal/adapters/redis/...

      - name: Stop disposable integration Redis
        if: always()
        shell: bash
        run: |
          if [ -n "${UP_TEST_REDIS_CONTAINER:-}" ]; then
            docker rm --force "${UP_TEST_REDIS_CONTAINER}" >/dev/null 2>&1 || true
          fi

      - name: Build
        run: go build ./...

      - name: Build (integration)
        run: go build -tags integration ./...
