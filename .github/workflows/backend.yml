name: Backend Quality Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, Vet, Test, Race and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: up_test
          POSTGRES_PASSWORD: up_test_pass
          POSTGRES_DB: up_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U up_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      UP_TEST_DATABASE_URL: postgres://up_test:up_test_pass@localhost:5432/up_test_db?sslmode=disable
      UP_TEST_DATABASE_SCHEMA: united_pass_test
      UP_TEST_REDIS_URL: redis://localhost:6379/1
      UP_TEST_REDIS_KEY_PREFIX: "up:test:"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Vet (integration)
        run: go vet -tags integration ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Integration tests
        run: go test -tags integration -race ./internal/adapters/postgres/... ./internal/adapters/redis/...

      - name: Build
        run: go build ./...

      - name: Build (integration)
        run: go build -tags integration ./...
